<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노무사 기출학습 RC35 · Warm Light Study</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="description" content="공인노무사 1차 기출 1,020문항(2022~2026) 원문 이미지 기반 문제풀이·오답노트">
<meta name="theme-color" content="#f7f6f2">
<style>
:root{
  --bg:#f4f2ee; --surface:#ffffff; --surface2:#ece9e3; --line:#dcd7cf;
  --ink:#1c1f24; --ink2:#5b6270; --ink3:#8a909b;
  --brand:#1f3a5f; --brand2:#2f5d8f; --brandSoft:#e3ebf5;
  --ok:#1f7a4d; --okSoft:#e2f3ea; --bad:#b4372f; --badSoft:#f9e4e1; --warn:#9a6a12; --warnSoft:#fbf0d9;
  --star:#d99a1c; --shadow:0 1px 2px rgba(20,25,35,.06),0 4px 14px rgba(20,25,35,.06);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161b; --surface:#1c2027; --surface2:#252a33; --line:#323844;
  --ink:#eceef2; --ink2:#aab1bd; --ink3:#7d8592;
  --brand:#8fb4e3; --brand2:#a9c7ee; --brandSoft:#22324a;
  --ok:#5fcf95; --okSoft:#173528; --bad:#f08a80; --badSoft:#3d1f1c; --warn:#e3b45a; --warnSoft:#3a2e15;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1c2027; --surface2:#252a33; --line:#323844;
  --ink:#eceef2; --ink2:#aab1bd; --ink3:#7d8592;
  --brand:#8fb4e3; --brand2:#a9c7ee; --brandSoft:#22324a;
  --ok:#5fcf95; --okSoft:#173528; --bad:#f08a80; --badSoft:#3d1f1c; --warn:#e3b45a; --warnSoft:#3a2e15;
  --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;letter-spacing:-.02em;font-size:17px;color:var(--brand);display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--brand);color:var(--bg);font-style:normal;font-size:13px}
nav.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:7px 10px;border-radius:9px;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}
h1{font-size:24px;letter-spacing:-.03em;margin:22px 0 4px}
h2{font-size:17px;margin:26px 0 10px;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:14px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--bg);font-weight:700}
.lbl{font-size:12.5px;color:var(--ink3);font-weight:700;letter-spacing:.02em;margin:14px 0 7px}
.lbl:first-child{margin-top:0}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--surface2);font-size:15px}
.btn.pri{background:var(--brand);color:var(--bg)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.big{width:100%;padding:15px;font-size:16px;margin-top:16px}
.grid{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;font-size:13px}
.grid .h{color:var(--ink3);font-weight:700;text-align:center;padding:4px 0}
.grid .s{font-weight:700;padding:8px 6px 8px 0;white-space:nowrap;font-size:13px}
.cell{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:6px 4px;text-align:center;cursor:pointer;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.cell b{font-size:13px}.cell small{color:var(--ink3);font-size:11px}
.bar{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:4px}.bar>i{display:block;height:100%;background:var(--brand2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.stat span{font-size:12.5px;color:var(--ink2)}
/* quiz */
.qhead{display:flex;align-items:center;gap:8px;margin:16px 0 10px}
.qmeta{font-weight:800;letter-spacing:-.02em}
.qmeta small{display:block;font-weight:500;color:var(--ink3);font-size:12.5px}
.prog{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:10px}.prog>i{display:block;height:100%;background:var(--brand);transition:width .2s}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink2);font-size:14px}
.paper{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;overflow:hidden;box-shadow:var(--shadow)}
.paper img{display:block;width:100%;height:auto;cursor:zoom-in}
.paper.zoom{overflow-x:auto}.paper.zoom img{width:auto!important;max-width:none;cursor:zoom-out}
:root[data-invert="1"] .paper{background:#111}:root[data-invert="1"] .paper img{filter:invert(1) hue-rotate(180deg)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 6px;box-shadow:var(--shadow)}
.stem{font-size:17px;font-weight:650;line-height:1.6;letter-spacing:-.01em;margin:0 0 10px;word-break:keep-all;overflow-wrap:anywhere}
.stem .qn{color:var(--brand);margin-right:4px}
.box{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:15.5px;line-height:1.6;word-break:keep-all}
.box div{padding-left:1.4em;text-indent:-1.4em}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 13px;cursor:pointer;font-size:15.5px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.opt .m{font-size:18px;line-height:1.3;flex:none}
.opt.sel{border-color:var(--brand);background:var(--brandSoft)}
.opt.ok{border-color:var(--ok);background:var(--okSoft)}.opt.ok .m{color:var(--ok);font-weight:800}
.opt.bad{border-color:var(--bad);background:var(--badSoft)}.opt.bad .m{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--brand);color:var(--bg);font-weight:700}
.seg button:disabled{opacity:.4;cursor:default}
.linkbtn{border:0;background:none;color:var(--brand2);font-size:13.5px;font-weight:600;padding:8px 0;cursor:pointer}
.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;height:54px;font-size:22px;cursor:pointer;display:grid;place-items:center;transition:transform .05s}
.choice:active{transform:scale(.97)}
.choice.sel{border-color:var(--brand);background:var(--brandSoft);font-weight:800}
.choice.ok{border-color:var(--ok);background:var(--okSoft);color:var(--ok);font-weight:800}
.choice.bad{border-color:var(--bad);background:var(--badSoft);color:var(--bad)}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.fb.ok{background:var(--okSoft);color:var(--ok)}.fb.bad{background:var(--badSoft);color:var(--bad)}.fb.info{background:var(--warnSoft);color:var(--warn)}
.fb b{font-size:16px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--ink2);margin:2px 4px 2px 0}
.tag.warn{background:var(--warnSoft);color:var(--warn)}.tag.ok{background:var(--okSoft);color:var(--ok)}
details{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details summary{cursor:pointer;padding:10px 14px;font-size:14px;color:var(--ink2);font-weight:600}
details .in{padding:0 14px 12px;font-size:14px;color:var(--ink2)}
details ol{padding-left:22px;margin:6px 0}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px;font:inherit;font-size:14px;resize:vertical}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.navbar .in{max-width:780px;margin:0 auto;display:flex;gap:8px}
.navbar .btn{flex:1}
.star{font-size:20px;line-height:1;color:var(--ink3)}.star.on{color:var(--star)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.li .t{flex:1;min-width:0}.li .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.li .t small{color:var(--ink3);font-size:12px}
.pill{font-size:12px;font-weight:800;padding:3px 8px;border-radius:7px}
.pill.ok{background:var(--okSoft);color:var(--ok)}.pill.bad{background:var(--badSoft);color:var(--bad)}.pill.no{background:var(--surface2);color:var(--ink3)}
input[type=search]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);color:var(--ink);font:inherit}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
th{color:var(--ink3);font-size:12.5px}
.muted{color:var(--ink3);font-size:13px}
.empty{text-align:center;color:var(--ink3);padding:40px 10px}
.kbd{font-size:12px;color:var(--ink3);margin-top:10px;text-align:center}
.res{text-align:center;padding:22px 16px}
.res .score{font-size:46px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.45);display:grid;place-items:center;padding:16px}
.modal .box2{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal p{margin:0 0 14px;font-size:15.5px;line-height:1.55}
.modal textarea{min-height:140px;font-size:12px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* RC32: small-screen resilient controls and keyboard accessibility */
.topin{min-width:0}
nav.tabs{min-width:0;scrollbar-width:thin}
button,.chip,.cell,.li{touch-action:manipulation}
button:focus-visible,.chip:focus-visible,.cell:focus-visible,.li:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.chip[role="button"]{display:inline-flex;align-items:center}
.cell[role="button"]{min-width:0}
.li{width:100%;color:var(--ink);text-align:left;font:inherit}
.li .t{flex:1;min-width:0}
.jumpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(37px,1fr));gap:6px;margin:12px 0}
.jumpgrid button{min-height:38px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);cursor:pointer;font-size:12px}
.jumpgrid button.answered{background:var(--brandSoft);border-color:var(--brand2)}
.jumpgrid button.current{outline:2px solid var(--brand);font-weight:800}
.jumpgrid button.starred::after{content:" ★";color:var(--star)}
.jumpbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.jumpbar input{width:78px;border-radius:8px;border:1px solid var(--line);padding:9px;color:var(--ink);background:var(--surface)}
.jumpbar .btn{padding:9px 12px}
.reviewbanner{margin:12px 0 8px;padding:10px 12px;border:1px solid var(--brand2);border-radius:12px;background:var(--brandSoft);font-size:14px}
.backup-actions{display:flex;flex-wrap:wrap;gap:8px}
.backup-actions label{display:inline-flex;align-items:center}
.reviewanswer{font-size:14px;color:var(--ink2);margin-top:6px}
@media (max-width:520px){
  h1{font-size:21px}.logo span{display:none}
  .grid{grid-template-columns:auto repeat(5,minmax(0,1fr));gap:3px}
  .grid .s{font-size:12px}.cell b{font-size:12px}
  .choice{height:50px;font-size:20px}
  .wrap{padding-left:12px;padding-right:12px}
  .topin{gap:5px;padding:9px 8px}
  .logo i{width:25px;height:25px}
  .iconbtn{width:32px;height:32px}
  nav.tabs{gap:0;flex:1;justify-content:flex-end}
  nav.tabs button{padding:7px 5px;font-size:12px}
  .stat{padding:10px 8px}.stat b{font-size:20px}.stat span{font-size:11px}
  .grid{font-size:11px}
  .qhead{gap:5px;flex-wrap:wrap}
  .qmeta{min-width:0;font-size:14px}
  .paper{margin:0 -12px}
  .navbar{padding-left:10px;padding-right:10px}
  .navbar .btn{padding:12px 8px;font-size:13px}
  .backup-actions .btn{padding:10px 12px}
  .paper{border-radius:0;border-left:0;border-right:0;padding:10px 6px}
  .paper.zoom img{width:180%!important}
}

/* RC34 / FOCUS STUDY redesign. Cosmetic layer only: original quiz state and grading remain intact. */
:root,:root[data-theme="dark"]{
  --bg:#0b101b;--surface:#151d2c;--surface2:#212c3d;--line:#2b364a;
  --ink:#f5f8ff;--ink2:#b2bdd2;--ink3:#8391aa;
  --brand:#7daeff;--brand2:#a8c7ff;--brandSoft:#213653;
  --ok:#6de0ac;--okSoft:#173d34;--bad:#ff938a;--badSoft:#46272d;
  --warn:#f5c572;--warnSoft:#413423;--star:#ffbf55;
  --shadow:0 14px 42px rgba(1,5,14,.13);--r:20px;
}
:root[data-theme="light"]{
  --bg:#f4f7fc;--surface:#fff;--surface2:#e9eff9;--line:#dbe3ee;
  --ink:#111e36;--ink2:#52617a;--ink3:#79869c;
  --brand:#2865c4;--brand2:#1d50ab;--brandSoft:#e4eeff;
  --ok:#0e8b5e;--okSoft:#dcf8eb;--bad:#c9484d;--badSoft:#fff0ee;
  --warn:#996013;--warnSoft:#fff3d9;--star:#d49417;
  --shadow:0 10px 30px rgba(14,29,60,.045);--r:20px;
}
html{scroll-behavior:smooth}body{font-size:15px;letter-spacing:-.01em;background:var(--bg)}
body:before{content:"";position:fixed;z-index:-1;pointer-events:none;inset:0;background:radial-gradient(circle at 79% 7%,rgba(62,104,180,.12),transparent 36%),radial-gradient(circle at 55% 90%,rgba(53,164,164,.035),transparent 34%)}
button{transition:background .16s ease,border-color .16s ease,transform .16s ease;color:var(--ink)}
button:hover:not(:disabled){filter:brightness(1.075)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible,.cell:focus-visible{outline:3px solid var(--brand2);outline-offset:3px}
header.top{position:fixed;inset:0 auto 0 0;display:flex;align-items:stretch;width:246px;height:100vh;border-right:1px solid var(--line);border-bottom:0;background:color-mix(in srgb,var(--surface) 83%,var(--bg));backdrop-filter:blur(24px);z-index:30}
.topin{height:100%;width:100%;max-width:none;display:flex;flex-direction:column;align-items:stretch;padding:30px 16px 20px;gap:0}
.logo{font-size:17px;font-weight:800;color:var(--ink);gap:11px;padding:0 10px;white-space:normal}
.logo i{font-size:22px;width:44px;height:44px;flex:none;border-radius:14px;background:linear-gradient(145deg,#88b7ff 0%,#4b7edc 53%,#69d4ce 130%);box-shadow:0 8px 22px rgba(57,110,208,.3);color:#0d1d38;font-family:Georgia,serif}
.logo span{display:flex;flex-direction:column;line-height:1.2}.logo strong{font-size:17px;letter-spacing:.14em}.logo small{margin-top:6px;color:var(--ink3);font-size:9px;letter-spacing:.14em;font-weight:700}
nav.tabs{margin:47px 0 0;display:flex;flex-direction:column;gap:6px;width:100%;flex:1;overflow:visible}
nav.tabs button{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:45px;border-radius:12px;padding:10px 14px;font-size:14px;color:var(--ink2);font-weight:600}
nav.tabs button.on{background:var(--brandSoft);color:var(--brand2);font-weight:800;box-shadow:inset 3px 0 var(--brand)}
.nav-glyph{font-size:21px;line-height:1;display:inline-grid;place-items:center;width:23px;font-weight:400;flex:none}
#themeBtn{width:100%;min-height:43px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface2);color:var(--ink2);border-color:var(--line)}
#themeBtn:after{content:"테마 전환";font-weight:700;font-size:13px}
.topin:after{content:"PERSONAL STUDY SPACE  •  2022–2026";color:var(--ink3);font-size:9px;text-align:center;letter-spacing:.09em;margin-top:18px;white-space:nowrap}
.wrap{max-width:1420px;width:calc(100% - 246px);margin-left:246px;margin-right:auto;padding:39px clamp(22px,3.7vw,58px) 112px}
h1,h2{letter-spacing:-.04em;color:var(--ink)}h1{font-size:34px;margin:0}h2{font-size:22px;margin:3px 0 0;font-weight:780}
.sub{font-size:14px;color:var(--ink2);line-height:1.75}
.hero{display:flex;align-items:center;justify-content:space-between;gap:30px;min-height:270px;padding:36px 42px;border-radius:27px;border:1px solid rgba(128,166,232,.28);background:linear-gradient(107deg,#192944 0%,#17223a 50%,#193d55 135%);position:relative;overflow:hidden;isolation:isolate;box-shadow:0 20px 55px rgba(0,8,33,.17)}
.hero:before{content:"";position:absolute;inset:auto -60px -180px 30%;height:390px;background:radial-gradient(ellipse,rgba(67,135,204,.22),transparent 60%);pointer-events:none;z-index:-1}
.hero:after{content:"N";font-family:Georgia,serif;font-size:280px;font-weight:800;position:absolute;right:8%;top:-100px;line-height:1;opacity:.04;z-index:-1}
.hero-main{min-width:0;flex:1}.hero-eyebrow{font-size:10px;letter-spacing:.17em;font-weight:800;color:#aac5f4;display:flex;align-items:center;gap:8px;white-space:nowrap}
.live-dot{width:8px;height:8px;background:#70dcbd;box-shadow:0 0 0 5px rgba(112,220,189,.12);border-radius:100%;display:inline-block;flex:none}
.hero-version{font-size:10px;border:1px solid rgba(192,217,255,.3);padding:2px 7px;border-radius:6px;margin-left:5px;letter-spacing:0}
.hero h1{color:#f9fbff;font-size:clamp(28px,3.2vw,43px);line-height:1.28;letter-spacing:-.055em;font-weight:800;margin:19px 0 15px}
.hero h1 em{font-style:normal;background:linear-gradient(95deg,#a5caff,#86e3d7);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{color:#c1cee3}.hero .sub strong{color:#fff}.hero-points{margin-top:20px;display:flex;flex-wrap:wrap;gap:9px}
.hero-points span{border:1px solid rgba(187,215,255,.17);border-radius:999px;padding:5px 11px;color:#c9d8ef;background:rgba(255,255,255,.045);font-size:11px}

/* RC35 / WARM LIGHT STUDY — legible, low-glare, paper-inspired learning interface.
   RC33 scoring, session and original exam images remain unchanged. */
:root,:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f7f6f2;--surface:#fffefc;--surface2:#f0f1ed;--line:#dde2dc;
  --ink:#273447;--ink2:#586778;--ink3:#657281;
  --brand:#315470;--brand2:#315f73;--brandSoft:#e5eef2;
  --ok:#247557;--okSoft:#e4f4e9;--bad:#ac4e4c;--badSoft:#fae9e6;
  --warn:#966b2c;--warnSoft:#fbf1dc;--star:#af7b29;
  --shadow:0 3px 22px rgba(46,58,48,.035);--r:19px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1d2529;--surface:#263137;--surface2:#303e45;--line:#43545a;
  --ink:#eef3f1;--ink2:#c3d0cf;--ink3:#adbfbe;
  --brand:#acd4d4;--brand2:#b0dddd;--brandSoft:#30474d;
  --ok:#a0e0b3;--okSoft:#254537;--bad:#f1a5a0;--badSoft:#4a2c30;
  --warn:#f1c47b;--warnSoft:#4d412c;--star:#efc981;
  --shadow:0 5px 20px rgba(0,0,0,.06);
}
html{scroll-behavior:smooth}
body{font-size:15px;line-height:1.7;letter-spacing:-.012em;background:var(--bg);color:var(--ink)}
body:before{background:none}
button,input,textarea{font-family:inherit}
button:hover:not(:disabled){filter:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible,.cell:focus-visible,.li:focus-visible{outline:3px solid #6d9b86;outline-offset:3px}

<body>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden><div class="box2" role="dialog" aria-modal="true"><div id="mbody"></div><div class="row" id="mbtns" style="justify-content:flex-end"></div></div></div>
<script src="data.js"></script>
<script>
"use strict";
const Q = window.QDATA || [], META = window.QMETA || {};
const BY = Object.fromEntries(Q.map(q=>[q.k,q]));
const YEARS=[2026,2025,2024,2023,2022];
const SUBJ=["노동법(1)","노동법(2)","민법","사회보험법","경영학개론","경제학원론"];
const SHORT={"노동법(1)":"노동법1","노동법(2)":"노동법2","민법":"민법","사회보험법":"사회보험","경영학개론":"경영","경제학원론":"경제"};
const C=["①","②","③","④","⑤"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- storage (per-viewer, safe) ---------- */
const SKEY="nomu1-progress-v2";
function cleanProgress(input){
  if(!input||typeof input!=="object"||Array.isArray(input)||!input.att||typeof input.att!=="object")throw new Error("기록 구조 오류");
  const out={att:{},star:{},memo:{},prefs:{}};
  for(const [k,a] of Object.entries(input.att)){
    if(!Object.hasOwn(BY,k)||!a||typeof a!=="object"||Array.isArray(a))continue;
    const n=Number(a.n),w=Number(a.w),last=Number(a.last);
    if(!Number.isSafeInteger(n)||n<1||n>1000000||!Number.isSafeInteger(w)||w<0||w>n||!Number.isInteger(last)||last<1||last>5||typeof a.ok!=="boolean")continue;
    out.att[k]={n,w,last,ok:a.ok,t:Number.isFinite(Number(a.t))?Number(a.t):0};
  }
  for(const k of Object.keys(input.star||{})){if(Object.hasOwn(BY,k)&&input.star[k])out.star[k]=1}
  for(const [k,v] of Object.entries(input.memo||{})){if(Object.hasOwn(BY,k)&&typeof v==="string")out.memo[k]=v.slice(0,5000)}
  const prefs=input.prefs||{};
  if(prefs.theme==="dark"||prefs.theme==="light")out.prefs.theme=prefs.theme;
  if(typeof prefs.invert==="boolean")out.prefs.invert=prefs.invert;
  if(prefs.view==="img"||prefs.view==="text")out.prefs.view=prefs.view;
  if(prefs.setup&&typeof prefs.setup==="object"){
    const p=prefs.setup;
    out.prefs.setup={
      years:Array.isArray(p.years)?p.years.filter(y=>YEARS.includes(y)): [2026],
      subs:Array.isArray(p.subs)?p.subs.filter(v=>SUBJ.includes(v)): ["노동법(1)"],
      scope:["all","new","wrong","everwrong","star"].includes(p.scope)?p.scope:"all",
      order:["seq","rand"].includes(p.order)?p.order:"seq",
      count:[0,10,20,40].includes(p.count)?p.count:0,
      mode:["practice","exam"].includes(p.mode)?p.mode:"practice"
    };
    if(!out.prefs.setup.years.length)out.prefs.setup.years=[2026];
    if(!out.prefs.setup.subs.length)out.prefs.setup.subs=["노동법(1)"];
  }
  return out;
}
function validSession(raw){
  if(!raw||typeof raw!=="object"||raw.done||!["practice","exam"].includes(raw.mode))return null;
  if(!Array.isArray(raw.ks)||!raw.ks.length||raw.ks.length>Q.length||new Set(raw.ks).size!==raw.ks.length||raw.ks.some(k=>!Object.hasOwn(BY,k)))return null;
  if(!Number.isInteger(raw.i)||raw.i<0||raw.i>=raw.ks.length||!Number.isFinite(raw.t0)||raw.t0>Date.now()+60000)return null;
  const ans={};for(const [k,v] of Object.entries(raw.ans||{})){if(raw.ks.includes(k)&&Number.isInteger(v)&&v>=1&&v<=5)ans[k]=v}
  return {ks:raw.ks,i:raw.i,mode:raw.mode,ans,done:false,t0:raw.t0,limit:raw.mode==="exam"?raw.ks.length*75:0,zoom:false,showImg:false,review:false};
}
function load(){try{
  const raw=JSON.parse(localStorage.getItem(SKEY)||"null");if(raw&&raw.att){const s=cleanProgress(raw);s.session=validSession(raw.session);return s}
}catch(e){}return{att:{},star:{},memo:{},prefs:{},session:null}}
function saveSession(){if(S&&!S.done){ST.session={ks:S.ks,i:S.i,mode:S.mode,ans:S.ans,done:false,t0:S.t0,limit:S.limit}};save()}
let ST=load();
function save(){try{localStorage.setItem(SKEY,JSON.stringify(ST))}catch(e){}}
function record(k,choice,ok){
  const a=ST.att[k]||{n:0,w:0};a.n++;if(!ok)a.w++;a.last=choice;a.ok=ok;a.t=Date.now();ST.att[k]=a;save();
}
const isOk=(q,c)=>q.a.includes(c);

/* ---------- theme ---------- */
function applyTheme(){
  const t=ST.prefs.theme||"light";document.documentElement.dataset.theme=t;
  document.documentElement.dataset.invert=ST.prefs.invert?"1":"0";
}
$("#themeBtn").onclick=()=>{
  const cur=ST.prefs.theme||document.documentElement.dataset.theme||"light";
  ST.prefs.theme=cur==="dark"?"light":"dark";save();applyTheme();toast(ST.prefs.theme==="dark"?"어두운 화면":"밝은 화면");
};
applyTheme();
function ask(msg,okLabel="확인",danger=false){return new Promise(res=>{const m=$("#modal");$("#mbody").innerHTML=`<p>${esc(msg)}</p>`;
  $("#mbtns").innerHTML=`<button class="btn ghost" id="mNo">취소</button><button class="btn pri" id="mOk" ${danger?'style="background:var(--bad)"':""}>${esc(okLabel)}</button>`;
  m.hidden=false;const done=v=>{m.hidden=true;res(v)};$("#mNo").onclick=()=>done(false);$("#mOk").onclick=()=>done(true);$("#mOk").focus()})}
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1400)}

/* ---------- routing ---------- */
let view="home", S=null; // S = session
function go(v){view=v;if(v!=="quiz"&&v!=="result")$("#navbar").hidden=true;render();window.scrollTo(0,0)}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;const v=b.dataset.v;if(view==="quiz"&&S&&!S.done){saveSession();if(S.mode==="exam"){
    ask("이 화면을 떠나도 진행 내용은 보관되지만 시험 시간은 계속 흐릅니다. 이동할까요?","이동").then(ok=>{if(ok){stopTimer();go(v)}});return
  }}stopTimer();go(v)};
function render(){
  if(document.body&&document.body.dataset)document.body.dataset.view=view;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  ({home:vHome,quiz:vQuiz,result:vResult,wrong:vWrong,search:vSearch,stats:vStats,about:vAbout})[view]();
}

/* ---------- setup state ---------- */
const P=Object.assign({years:[2026],subs:["노동법(1)"],scope:"all",order:"seq",count:0,mode:"practice"},ST.prefs.setup||{});
function pool(){
  return Q.filter(q=>P.years.includes(q.y)&&P.subs.includes(q.s)).filter(q=>{
    const a=ST.att[q.k];
    if(P.scope==="new")return !a;
    if(P.scope==="wrong")return a&&a.ok===false;
    if(P.scope==="everwrong")return a&&a.w>0;
    if(P.scope==="star")return ST.star[q.k];
    return true;
  });
}
function chipRow(list,isOn,label,onTap){
  return list.map((v,i)=>`<button type="button" class="chip ${isOn(v)?"on":""}" data-i="${i}" aria-pressed="${isOn(v)}">${esc(label(v))}</button>`).join("");
}
function vHome(){
  const tot=Q.length,done=Object.keys(ST.att).filter(k=>BY[k]).length;
  const okN=Object.entries(ST.att).filter(([k,a])=>BY[k]&&a.ok).length;
  const wrongN=Object.entries(ST.att).filter(([k,a])=>BY[k]&&a.ok===false).length;
  const pl=pool();
  const paused=validSession(ST.session);
  $("#app").innerHTML=`
  <section class="hero" aria-label="학습 대시보드">
    <div class="hero-main">
      <div class="hero-eyebrow"><span class="live-dot"></span> WARM LIGHT STUDY <span class="hero-version">RC35</span></div>
      <h1>차분하게 한 문제씩,<br><em>합격에 가까워지기.</em></h1>
      <p class="sub">공인노무사 1차 기출 · 2022~2026 · <strong>${tot.toLocaleString()}문항</strong><br>기출 이미지 중심의 정확한 연습과 실전 채점</p>
      <div class="hero-points"><span>✓ 기출 5개년</span><span>✓ 자동 저장</span><span>✓ 오답 복습</span></div>
    </div>
    <div class="hero-side" aria-label="전체 학습 진행률 ${Math.round(done/tot*100)}퍼센트">
      <div class="hero-ring" style="--progress:${(done/tot*100).toFixed(2)}%"><div><b>${Math.round(done/tot*100)}%</b><small>학습 진행률</small></div></div>
      <p><strong>${done.toLocaleString()}</strong> / ${tot.toLocaleString()}문항 완료</p>
    </div>
  </section>
  ${tot!==1020?`<div class="fb bad" role="alert">문항 데이터가 ${tot}개만 로딩되었습니다. ZIP 파일을 폴더째 압축 해제했는지, data.js가 index.html과 같은 위치에 있는지 확인하세요.</div>`:""}
  ${paused?`<div class="card resume-card" style="margin-top:18px"><b>↗ &nbsp; 진행 중인 ${paused.mode==="exam"?"실전시험":"연습"}</b><p class="muted" style="margin:5px 0">${paused.i+1}/${paused.ks.length}번 · ${Object.keys(paused.ans).length}문항 답변${paused.mode==="exam"?" · 제한시간 계속 진행":""}</p><div class="row"><button class="btn pri" id="resumeBtn">이어서 풀기</button><button class="btn ghost" id="discardBtn">새로 시작</button></div></div>`:""}
  <div class="section-heading"><div><span class="section-kicker">01 / YOUR PROGRESS</span><h2>나의 학습 현황</h2></div><span class="section-side">학습 기록은 이 기기에만 저장돼요</span></div>
  <div class="stats">
    <div class="stat"><span class="stat-icon">▦</span><b>${done.toLocaleString()} <small>/ ${tot.toLocaleString()}</small></b><span>누적 학습 문항</span></div>
    <div class="stat"><span class="stat-icon stat-icon--blue">↗</span><b>${done?Math.round(okN/done*100):0}<small>%</small></b><span>최근 정답률</span></div>
    <div class="stat"><span class="stat-icon stat-icon--amber">◎</span><b>${wrongN.toLocaleString()}</b><span>복습할 오답</span></div>
  </div>
  <div class="section-heading"><div><span class="section-kicker">02 / PRACTICE BUILDER</span><h2>나만의 학습 세트</h2></div><span class="section-side">연도와 과목을 고르면 바로 시작할 수 있어요</span></div>
  <div class="card setup-card"><div class="setup-card-head"><strong>문제풀이 설정</strong><span>원하는 조건을 선택하세요</span></div>
    <div class="lbl">연도 (회차)</div><div class="row" id="cYear">${chipRow(YEARS,v=>P.years.includes(v),v=>v+" · "+({2022:31,2023:32,2024:33,2025:34,2026:35})[v]+"회")}</div>
    <div class="lbl">과목</div><div class="row" id="cSub">${chipRow(SUBJ,v=>P.subs.includes(v),v=>SHORT[v])}</div>
    <div class="lbl">범위</div><div class="row" id="cScope">${chipRow(["all","new","wrong","everwrong","star"],v=>P.scope===v,v=>({all:"전체",new:"안 푼 문제",wrong:"지금 틀린 문제",everwrong:"한 번이라도 틀림",star:"별표"})[v])}</div>
    <div class="lbl">순서 · 문항 수</div><div class="row" id="cOrder">${chipRow(["seq","rand"],v=>P.order===v,v=>v==="seq"?"번호순":"섞기")}<span style="width:8px"></span>${chipRow([0,10,20,40],v=>P.count===v,v=>v?v+"문항":"모두")}</div>
    <div class="lbl">방식</div><div class="row" id="cMode">${chipRow(["practice","exam"],v=>P.mode===v,v=>v==="practice"?"연습 · 바로 채점":"실전 · 끝나고 채점")}</div>
    <button class="btn pri big" id="startBtn" ${pl.length?"":"disabled"}>${pl.length?`${Math.min(pl.length,P.count||pl.length)}문항 시작`:"조건에 맞는 문제가 없습니다"} &nbsp; ↗</button>
    ${P.mode==="exam"?`<p class="muted" style="margin:8px 0 0;text-align:center">실전은 문항당 1분 15초 기준 타이머가 켜집니다 (40문항 50분).</p>`:""}
  </div>
  <div class="section-heading"><div><span class="section-kicker">03 / COURSE MAP</span><h2>회차·과목별 학습지도</h2></div><span class="section-side">표의 칸을 누르면 해당 과목으로 이동해요</span></div>
  <div class="card course-card">
    <div class="grid"><div></div>${YEARS.map(y=>`<div class="h">${y}</div>`).join("")}
    ${SUBJ.map(s=>`<div class="s">${SHORT[s]}</div>`+YEARS.map(y=>{
      const qs=Q.filter(q=>q.y===y&&q.s===s),d=qs.filter(q=>ST.att[q.k]),o=d.filter(q=>ST.att[q.k].ok);
      return `<div class="cell" data-y="${y}" data-s="${esc(s)}" title="${y} ${s}"><b>${d.length?Math.round(o.length/d.length*100)+"%":"–"}</b><small>${d.length}/${qs.length}</small><div class="bar"><i style="width:${qs.length?d.length/qs.length*100:0}%"></i></div></div>`}).join("")).join("")}
    </div>
    <p class="muted" style="margin:10px 0 0">칸을 누르면 그 회차·과목을 번호순으로 바로 풉니다. 위 숫자는 정답률, 아래는 푼 문항/전체.</p>
  </div>`;
  const bind=(id,list,fn)=>$(id).onclick=e=>{const c=e.target.closest(".chip");if(!c)return;fn(list[+c.dataset.i]);ST.prefs.setup=P;save();vHome()};
  const tog=(arr,v)=>{const i=arr.indexOf(v);if(i>=0){if(arr.length>1)arr.splice(i,1)}else arr.push(v)};
  bind("#cYear",YEARS,v=>tog(P.years,v));bind("#cSub",SUBJ,v=>tog(P.subs,v));
  bind("#cScope",["all","new","wrong","everwrong","star"],v=>P.scope=v);
  $("#cOrder").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;const idx=[...$("#cOrder").querySelectorAll(".chip")].indexOf(c);
    if(idx<2)P.order=["seq","rand"][idx];else P.count=[0,10,20,40][idx-2];ST.prefs.setup=P;save();vHome()};
  bind("#cMode",["practice","exam"],v=>P.mode=v);
  $("#startBtn").onclick=()=>start(pool(),P.mode,P.order,P.count);
  if(paused){
    $("#resumeBtn").onclick=()=>resume();
    $("#discardBtn").onclick=()=>ask("저장된 진행 중인 시험을 삭제할까요? 기존 완료 풀이 기록은 유지됩니다.","진행 내역 삭제",true).then(ok=>{if(ok){ST.session=null;S=null;save();vHome();}});
  }
  document.querySelectorAll(".cell").forEach(c=>c.onclick=()=>start(Q.filter(q=>q.y===+c.dataset.y&&q.s===c.dataset.s),"practice","seq",0));
}

/* ---------- session ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(list,mode,order,count,initialIndex=0){
  if(!list.length){toast("문제가 없습니다");return}
  if(validSession(ST.session)){
    ask("진행 중인 풀이가 있습니다. 저장된 진행 내용을 삭제하고 새로 시작할까요?","새로 시작",true).then(ok=>{if(ok){ST.session=null;save();start(list,mode,order,count,initialIndex)}});
    return;
  }
  let ks=(order==="rand"?shuffle(list):list).map(q=>q.k);
  if(count)ks=ks.slice(0,count);
  S={ks,i:Math.min(ks.length-1,Math.max(0,Number.isInteger(initialIndex)?initialIndex:0)),mode,ans:{},done:false,t0:Date.now(),limit:mode==="exam"?ks.length*75:0,zoom:false,showImg:false,review:false};
  saveSession();if(mode==="exam")startTimer();go("quiz");
}
function resume(){
  const previous=validSession(ST.session);if(!previous){ST.session=null;save();toast("이어 풀 수 있는 시험이 없습니다");vHome();return}
  S=previous;
  if(S.mode==="exam"&&Date.now()-S.t0>=S.limit*1000){finish(true);return}
  if(S.mode==="exam")startTimer();go("quiz");
}
let timerId=null;
function startTimer(){stopTimer();timerId=setInterval(()=>{const e=$("#timer");if(!S||S.done){stopTimer();return}
  const left=S.limit-Math.floor((Date.now()-S.t0)/1000);if(e)e.textContent=fmt(Math.max(0,left));if(left<=0){stopTimer();finish(true)}},1000)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

function vQuiz(){
  if(!S){go("home");return}
  const k=S.ks[S.i],q=BY[k],chosen=S.ans[k],revealed=!!S.review||(S.mode==="practice"&&chosen!=null);
  const multi=q.a.length>1, starOn=!!ST.star[k];
  const left=S.limit?S.limit-Math.floor((Date.now()-S.t0)/1000):0;
  const answered=Object.keys(S.ans).length;
  let fb="";
  if(revealed){
    const ok=chosen!=null&&isOk(q,chosen), unanswered=chosen==null;

      <li>복수정답 인정: ${multi.map(q=>`${q.y} ${SHORT[q.s]} ${q.n}번(${q.a.length===5?"전항":q.a.map(x=>C[x-1]).join(",")})`).join(", ")}</li>

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(view!=="quiz"||!S||!$("#modal").hidden||e.target.closest("button,input,textarea,select,summary,a,[role=button],[contenteditable=true]"))return;
  if(e.key>="1"&&e.key<="5"){choose(+e.key)}
  else if(e.key==="ArrowRight"||e.key==="Enter"){S.i===S.ks.length-1?(S.review?go("result"):submitSession()):move(1)}
  else if(e.key==="ArrowLeft")move(-1);
  else if(e.key.toLowerCase()==="s")toggleStar();
});
render();
