<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공인노무사 2차 · 47개 법률문항 근거 검토</title><style>*{box-sizing:border-box}article,p,section{min-width:0;overflow-wrap:anywhere}body{background:#f8fafb;color:#1b2731;font-family:system-ui,"Malgun Gothic",sans-serif;margin:0}header{background:#163d49;color:white;padding:20px max(16px,calc((100vw - 1000px)/2))}h1{font-size:1.5rem}main{max-width:980px;margin:20px auto;padding:0 14px}input,select{padding:12px;border:1px solid #c4d0d5;border-radius:8px;max-width:100%;font:inherit}input{width:65%}select{width:30%}article{background:white;border:1px solid #dce2e5;border-radius:12px;padding:16px;margin:12px 0}summary{cursor:pointer;font-weight:700}summary small{color:#657080}p{line-height:1.8;white-space:pre-wrap}a{color:#005a87}section{border-top:1px solid #eceef1;padding-top:8px}.status{font-weight:600;color:#89510b}.mini{color:#556674;font-size:.9rem}code{word-break:break-word}.muted{background:#fff4db;padding:10px;border-radius:8px}@media(max-width:600px){input,select{width:100%;margin-bottom:6px}header{padding:15px}}</style></head><body><header><h1>법률 47개 문항 — 2022~2026 연혁 검증</h1><p>기존 1·2차 원본 보존 · 모든 47건의 최종 승인 HOLD · 신규 법률 분석은 학습용 예비초안</p></header><main><div class="muted">법률 근거가 있는 13문항도 시험일 조문·부칙 및 직접 판례의 개별 최종 교차검증은 남아 있습니다. 공식 정답·합격 가능성 판정이 아닙니다.</div><p id="counts"></p><input id="q" placeholder="연도·과목·논점 검색" aria-label="문항 검색"><select id="filter" aria-label="검토 상태"><option value="all">전체</option><option value="draft">예비 법률초안 13건</option><option value="hold">기본 검토대기 34건</option></select><div id="entries"></div></main><script>const data=[{"id":"2023-admin-1","examYear":2023,"subject":"행정쟁송법","topic":"이주대책·취소판결 기속력","points":50,"sourceExcerpt":"【문제1】A시는택지개발예정지구지정공람공고가이루어진P사업지구에서택지\n     개발사업을시행하고있으며, 甲은P사업지구에주택을소유하고있는자\n       이다. A시는택지개발사업과관련한이주대책을수립ㆍ공고하였는데, 이에\n     의하면이주대책대상자요건을‘택지개발예정지구지정공람공고일1년\n    이전부터보상계약체결일또는수용재결일까지계속하여P사업지구내\n     주택을소유하고계속거주한자로, A시로부터그주택에대한보상을받고\n     이주하는자’로정하고있다. 甲은A시에이주대책대상자선정신청을\n      하였으나, A시는‘기준일이후주택취득’을이유로甲을이주대책대상에서\n     제외하는결정을하였고, 이결정은2023.  6. 28. 甲에게통보되었다(이하\n      ‘1차결정’이라함). 이에甲은A시에이의신청을하면서, 이의신청서에\n    이주대책대상자선정요건을충족함을증명할수있는마을주민확인서,\n     수도개설사용, 전력개통사용자확인등증빙서류를새롭","lawResearchState":"PRELIMINARY_SUBSTANTIVE_DRAFT_HOLD","legalDraftAvailable":true,"legalSourceUrls":["https://law.go.kr/lsInfoP.do?docType=JO&joNo=000100&lsiSeq=195052","https://www.law.go.kr/LSW/precInfoP.do?precSeq=619293"],"pdf":"source_pdf/2023/2023_admin.pdf","body":[{"heading":"Ⅰ. 심사할 처분을 먼저 특정","text":"택지개발사업 시행자가 이주대책 대상자 선정을 거부한 1차결정과 이후 이의신청에 관한 후속조치를 구분한다. 원문에서는 이주대책대상자 요건, 대상자 판정 기준일, 신청인의 소유·거주 기간 및 수도·전력 사용 자료를 특정해 놓았다. 제소기간·전심절차·처분성과 원고적격은 어느 결정을 대상으로 소를 제기하는지에 따라 달라질 수 있으므로 결정의 법적 성질을 먼저 밝힌다."},{"heading":"Ⅱ. 취소판결의 기속력 범위","text":"행정소송법 제30조는 처분을 취소하는 확정판결의 기속력과 재처분 의무를 규정한다. 기속력은 판결 주문뿐 아니라 그 전제가 된 구체적 위법사유에 관한 판단에 미치지만, 선행 처분과 기본적 사실관계가 다른 이유로 재처분하는 것까지 당연히 금지하는 것은 아니다. 따라서 1차결정의 처분사유와 새 증빙을 근거로 한 결정의 사유가 기본적 사실관계에서 동일한지를 검토해야 한다."},{"heading":"Ⅲ. 자료별 사실포섭","text":"주택 취득·거주 계속성, 공람공고일, 이주대책 공고, 보상계약·수용재결일, 새로운 마을주민 확인서·수도개설·전력사용 증빙을 각각 어떤 요건을 증명하는 자료인지 표로 정리한다. 공고의 요건을 충족한다는 진술과 이를 뒷받침하는 증거의 신빙성은 별도 판단한다. 선행 확정판결이 실제로 존재하는지 및 어떤 사유로 취소되었는지도 원문 후반을 대조해야 한다."}]},{"id":"2025-labor2-1","examYear":2025,"subject":"노동법2","topic":"교섭단위 분리·부당노동행위 기간","points":50,"sourceExcerpt":"【문제 1】상시 근로자 약 1,300명을 고용하여 자동차 부품을 생산하는 A회사는 사\n      무직(전체근로자의 약 27%)과 생산직(전체근로자의 약 73%) 근로자로 구\n      성되어 있다. A회사의 생산직군은 노동조합에 가입(가입률 약 80%)하는\n      데 비해 사무직군은 노동조합 가입에는 제한이 없지만 통상적으로 가입하\n      지 않았다. 생산직 중심의 산별노조 A지회는 유일한 노동조합으로서 2019\n      년 12월 ‘품질향상을 위한 격려금 100만원’을 생산직에만 지급하고 사무직\n      에는 지급하지 않는 단체협약을 체결하였다. 또 사무직이 반대하는 임금\n      피크제의 도입에 대해서 생산직 중심의 산별노조 A지회는 무관심하였다.\n      2021년 10월 근속연수가 비교적 짧은 사무직 근로자를 중심으로 A회사\n      사무직 노동조합(기업별 노동조합)이 결성되었고, 2021","lawResearchState":"PRELIMINARY_SUBSTANTIVE_DRAFT_HOLD","legalDraftAvailable":true,"legalSourceUrls":["https://law.go.kr/LSW/lsInfoP.do?efYd=20210706&lsiSeq=228175","https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=268357"],"pdf":"source_pdf/2025/2025_labor2.pdf","body":[{"heading":"Ⅰ. 분리 필요성을 판단하는 법적 틀","text":"노동조합법 제29조의3은 사업 또는 사업장을 기본 교섭단위로 하되 근로조건의 현격한 차이, 고용형태 및 교섭 관행을 고려하여 분리·통합 결정을 할 수 있도록 한다. 사무직과 생산직의 명칭만 다르거나 독립노조가 생겼다는 사실만으로 자동 분리되는 것은 아니다. 임금피크제에 대한 이해대립, 노조가입률과 대표성, 생산직에만 지급된 격려금, 실제 교섭 대표 상황 및 근로조건 차이의 정도를 증빙별로 검토한다."},{"heading":"Ⅱ. 사례의 시간축","text":"2019년 생산직만의 격려금 규정, 2021년 사무직 노동조합 설립과 이후의 교섭요구·분리 신청을 시간순으로 배열한다. 교섭대표노동조합 결정 절차와 노동위원회 분리 결정의 전후관계, 절차상 신청 주체와 시기의 적법성을 검토하고, 차별로 의심되는 사정이 곧바로 부당노동행위를 구성하는지와 공정대표의무의 문제를 구별한다. 시정신청 기간의 기산점은 행위 유형과 법정 규정을 따로 대조해야 한다."},{"heading":"Ⅲ. 연혁 적용상 주의","text":"이 문제는 2025년에 시행된 시험이므로, 2026년 3월 10일 시행된 노동조합법·시행령 개정규정을 적용해서는 안 된다. 시험 당시 교섭단위 분리 기준과 기존 신청기간 규정을 기준으로 결론의 조건을 적시해야 한다. 해당 사무직 노동조합이 독자 교섭대표권을 갖는다는 결론은 분리의 필요성 및 법적 절차가 확인된 뒤에만 확정할 수 있다."}]},{"id":"2022-civil-1","examYear":2022,"subject":"민사소송법","topic":"예비적 청구·선정당사자","points":50,"sourceExcerpt":"【문제 1】동업관계에 있는 乙, 丙, 丁, 戊는 자신들의 사업장 앞에 있는 X토지를\n\n     甲으로부터 임차하여 주차장으로 사용하고 있었다. 위 4인을 대표한다고\n\n     주장하는 乙은 X토지를 甲으로부터 매수하기로 하고 甲과 X토지에 대한\n\n     매매계약을 체결하였다. 사업자금의 대출을 위해 X토지의 등기가 필요\n\n     하다는 사정을 들은 甲은 매매대금의 전액을 지급받지 못하였음에도\n\n     불구하고 X토지의 등기를 위 4인에게 이전하여 주었으나 위 4인은 매매\n\n     잔대금을 지급하지 않고 있다. 이에 甲은 乙, 丙, 丁, 戊를 상대로 주위적\n\n     으로는 매매계약이 유효하다면 X토지의 매매대금 전액의 지급을 구하고,\n\n     예비적으로는 매매계약이 무효라면 X토지의 소유권이전등기의 말소를\n\n     구하는 소를 제기하였다. (단, 아래의 각 물음은 독립적임) (50점)\n\n 물음 1) 제","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2022/2022_civil.pdf","body":[]},{"id":"2023-civil-1","examYear":2023,"subject":"민사소송법","topic":"상계항변·기판력","points":50,"sourceExcerpt":"【문제1】甲은乙을피고로매매대금채권5천만원의지급을구하는소(이하, ‘A소’라\n     한다)를제기하였다. 이소송에서乙은甲에대하여갖고있는대여금채권\n      6천만원(이하, ‘이사건대여금채권’이라한다)을자동채권으로하는상계의\n     항변을주장하였다. 다음물음에답하시오. (다만, 아래의각물음은독립\n      적임) (50점)\n\n 물음1) ①상계의항변을주장한乙은A소계속중이사건대여금채권을소구채권\n     으로하여甲을피고로하는대여금반환을구하는소(이하, ‘B소’라한다)를\n      제기하였다. 乙이제기한B소는적법한가?\n    ②만일甲이제기한A소계속전에乙이이사건대여금채권의반환을\n      구하는소(‘C소’라한다)를제기하였다면, 乙은그후제기된甲의A소에서\n     이사건대여금채권을자동채권으로하는상계의항변을주장할수있는가?\n         (20점)\n\n 물음2) 甲이제기한A소에서乙이이사건대여금채권을자동채권으로하는상계의\n     항변을주","lawResearchState":"PRELIMINARY_SUBSTANTIVE_DRAFT_HOLD","legalDraftAvailable":true,"legalSourceUrls":["https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=180709"],"pdf":"source_pdf/2023/2023_civil.pdf","body":[{"heading":"Ⅰ. 문제 구조","text":"甲이 乙에게 5,000만 원 매매대금을 청구한 A소에서 乙이 6,000만 원 대여금채권으로 상계를 주장한다. 첫 물음은 자동채권에 대한 B소·C소의 별소와 상계항변의 중복제소 관계, 둘째 물음은 상계판단의 기판력 범위와 후소의 효력을 묻는다. 자동채권의 액면 전체와 상계에 실제로 대항한 금액을 구분해야 한다."},{"heading":"Ⅱ. 기판력의 조문상 특칙","text":"민사소송법 제216조 제1항은 원칙적으로 확정판결 주문에 포함되는 판단에만 기판력을 인정하면서, 제2항은 상계항변의 자동채권 성립 여부에 관한 판단에 예외적으로 상계로 대항한 액수의 범위 내 기판력을 인정한다. 따라서 매매대금 5,000만 원과 대여금 6,000만 원이라는 금액을 단순히 빼서 전부 기판력의 범위로 취급할 수 없다. 상계항변이 실제로 법원의 본안판단 대상이 되었는지, 인용·기각과 판단의 선후관계도 검토한다."},{"heading":"Ⅲ. 별소의 중복과 결론","text":"B소가 A소 계속 중 제기되었는지, C소가 A소보다 먼저 계속했는지, 두 소송이 청구취지·소송물이 같은지, 상계항변의 방어방법이 별소와 양립할 수 있는지가 논점이다. 상계항변의 허용성과 확정판결의 효력은 서로 다른 시점에서 판단하므로 판례에 따른 중복소송의 처리와 기판력 충돌 방지의 구체적 기준을 분리해야 한다. 사건별 직접 판례를 대조하기 전에는 별소의 최종 적법성 및 금전결론을 확정하지 않는다."}]},{"id":"2025-admin-1","examYear":2025,"subject":"행정쟁송법","topic":"직업훈련 지원금·기속력","points":50,"sourceExcerpt":"【문제 1】직업능력개발 훈련비용 지원금과 관련한 아래 질문에 답하시오. (50점)\n\n\n<사례 1>\n근로자 甲은 A지방고용노동청장(이하 ‘A청장’)에게 ‘직업능력개발 훈련비용 지원금\n(이하 ‘지원금’)’을 신청하였다. A청장은 “甲이 참여하는 훈련 프로그램은 훈련비 지\n원 관련 규정의 취지에 비추어 직업능력개발 훈련의 목적에 부합하지 않는다(이하\n‘<처분사유1>’)”는 사유로 甲의 신청을 거부하였다. 이에 甲은 거부처분취소소송을\n제기하였는데, 소송의 계속 중 A청장은 거부처분 사유로 기존의 <처분사유1> 이외\n에 “甲이 제출한 훈련비용 지원서에는 관계 법규에 따라 기재하여야 하는 사항 중\n일부가 누락되어 유효한 신청서로 볼 수 없다(이하 ‘<처분사유2>’)”라는 새로운 사유\n를 추가하였다. 관할 법원은 甲에게 <처분사유2>는 기존 <처분사유1>과 사회적 사\n실관계가 다른 별개의 사항이지만 처분사유의 추가에 동의하는","lawResearchState":"PRELIMINARY_SUBSTANTIVE_DRAFT_HOLD","legalDraftAvailable":true,"legalSourceUrls":["https://law.go.kr/lsInfoP.do?docType=JO&joNo=000100&lsiSeq=195052","https://www.law.go.kr/LSW/precInfoP.do?precSeq=619293"],"pdf":"source_pdf/2025/2025_admin.pdf","body":[{"heading":"Ⅰ. 서로 다른 두 처분사유","text":"사례 1에서 처분사유 1은 훈련 프로그램의 목적 부합성 부족이고, 처분사유 2는 신청서 기재사항 누락이다. 양자는 같은 훈련비 지원금 사건에서 발생했다고 하더라도 그 기초가 되는 사회적 사실관계가 같다고 단정할 수 없다. 처분사유 추가·변경 허용 여부는 행정소송에서 처분의 동일성을 유지하면서 당사자의 방어권을 보장하는 범위인지에 달려 있다."},{"heading":"Ⅱ. 동의의 효과와 판단 기준","text":"새 사유에 관하여 원고가 절차상 동의하였다는 사실을 어떻게 해석할지와, 그 동의만으로 동일성 없는 처분사유의 추가·변경이 허용되는지는 구분해야 한다. 행정소송법상 심리와 변론주의·직권심리의 관계, 처분사유 추가·변경의 범위에 관한 판례, 상대방 방어권 및 절차 보장을 먼저 검증한다. 소송 중 추가된 서류 미비라는 새로운 사실이 원래 거부처분을 사후적으로 정당화하는지에 관한 평가를 별도로 서술해야 한다."},{"heading":"Ⅲ. 취소판결 후 재처분","text":"행정소송법 제30조의 기속력은 동일 처분사유에 의한 반복처분과 기본적 사실관계가 다른 새로운 처분사유를 구분한다. 거부처분취소판결 이후 행정청이 재처분할 의무가 있다는 것과 신청인이 반드시 지원금을 지급받는다는 것은 동일하지 않다. 지원신청서의 유효성, 법령상 실체 요건, 절차적 하자 보완 여부를 개별적으로 판단한다."}]},{"id":"2023-labor2-1","examYear":2023,"subject":"노동법2","topic":"연맹 교섭요구·대표권","points":50,"sourceExcerpt":"【문제1】A회사는자동차의부품을생산하는회사이며, A회사내에는대다수의근로\n     자가가입한A회사노동조합이있다. A회사근로자가운데A회사노동조합\n     외에다른노동조합에가입한자는없다. A회사노동조합은2023. 1. 1. 임금\n     인상을목적으로단체교섭을하였으나결렬되었고, 적법한절차에따라\n           2023. 2. 23.부터파업에들어갔다. 이에대해A회사는2023. 3. 10.부터직장\n     폐쇄에들어갔다. 한편, 노사간에파업과직장폐쇄를거치면서상호양보의\n     가능성이고려되고있는상황에서2023. 3. 12. A회사노동조합은상급단체인\n     B금속노동조합연맹에 단체교섭권을 위임하였고, B금속노동조합연맹은\n     새로운타협안을마련하여A회사에대해2023. 3. 18.부터2023. 6. 14.까지\n     3회에걸쳐단체교섭을요구하였으나, A회사는직장폐쇄를유지하면서계속\n     하여단체교섭을거부하였다.\n   ","lawResearchState":"PRELIMINARY_SUBSTANTIVE_DRAFT_HOLD","legalDraftAvailable":true,"legalSourceUrls":["https://law.go.kr/LSW/lsInfoP.do?efYd=20210706&lsiSeq=228175"],"pdf":"source_pdf/2023/2023_labor2.pdf","body":[{"heading":"Ⅰ. 본래 교섭권과 위임된 권한","text":"노동조합법 제29조는 노동조합 대표자의 교섭·체결 권한과 권한 위임을 구분한다. 2023년 3월 12일 A회사 노동조합이 B금속노동조합연맹에 교섭권을 위임하였다면 위임의 범위와 상대방 통보 여부를 확인한다. 연맹이 독립된 교섭대표노동조합이 되었다는 주장과, 적법하게 권한을 위임받아 대리 교섭하는 주장은 동일하지 않다. 교섭창구 단일화의 해당 여부 역시 회사에 복수 노동조합이 있는지와 법령 예외를 고려한다."},{"heading":"Ⅱ. 파업·직장폐쇄 중 성실교섭 의무","text":"A회사 노동조합은 2023년 2월 23일부터 파업하고 회사는 3월 10일부터 직장폐쇄를 실시하였다. 이후 B연맹은 3월 18일부터 6월 14일까지 세 차례 교섭을 요구하였다. 노동조합법 제30조의 성실교섭·정당한 이유 없는 교섭거부 금지 원칙은 쟁의행위 중에도 법정 요건에 따라 검토할 필요가 있다. 직장폐쇄를 하고 있다는 사정만으로 교섭거부의 정당한 이유가 당연히 성립하는 것은 아니다."},{"heading":"Ⅲ. 사실판단의 관문","text":"교섭요구서 원문, 위임 사실 통지, 교섭 의제의 변경 여부, 근로자 집단대표권의 성질, 사용자의 답변 내용, 개별 교섭일정이 판단의 핵심 자료다. 단체교섭 거부가 부당노동행위인지 여부는 적법한 상대방과 구체적 사정이 확인되어야 하므로, 직장폐쇄와 교섭거부를 별도로 판단하고 기간의 계산도 시험 당시 규정으로 확인한다."}]},{"id":"2025-civil-1","examYear":2025,"subject":"민사소송법","topic":"대여금·증명책임·사문서","points":50,"sourceExcerpt":"【문제 1】2022. 5. 1. 甲은 乙에게 금 8,000만 원을 이자 없이 1년의 기한으로 대여\n      하였는데, 기한이 지나도록 乙이 돈을 갚지 않아 甲은 乙에게 대여금의\n      상환을 독촉하였다. 2023. 10. 15.이 되어서 乙은 “2022. 5. 1.에 차용한 돈\n      을 2024. 10. 31.까지 甲에게 지급하지 못할 때 甲의 요구가 있으면 乙이\n      소장하는 고려청자(이하 ‘고려청자’라 함)를 甲에게 양도한다.”라는 각서\n      (이하 ‘각서’라 함)를 써 주었다. 고려청자는 5,000만 원 정도로 평가된다.\n      2024. 11. 5. 甲은 乙에게 돈을 갚으라고 하였고, 乙은 묵묵부답이었다.\n      2025. 2. 1. 甲은 乙을 상대로 금 8,000만 원의 지급을 구하는 소를 제기하\n      였다. 소송에서 甲은 대여금 상환을 독촉하는 3통의 내용증명 우편을 ","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2025/2025_civil.pdf","body":[]},{"id":"2022-admin-1","examYear":2022,"subject":"행정쟁송법","topic":"토석채취허가·제3자 소송","points":50,"sourceExcerpt":"【문제 1】채석업자 丙은 P산지(山地)에서 토석채취를 하기 위하여 관할행정청\n\n     군수 乙에게 토석채취허가신청을 하였다. 乙은 丙의 신청서류를 검토한\n\n     후 적정하다고 판단하여 토석채취허가(이하 ‘이 사건 처분’이라 한다.)를\n\n      하였다. 한편, P산지 내에는 과수원을 운영하여 거기에서 재배된 과일로\n\n     만든 잼 등을 제조ㆍ판매하는 영농법인 甲이 있는데, 그곳에서 제조하는\n\n     잼 등은 청정지역에서 재배하여 품질 좋은 제품이라는 명성을 얻어\n\n     인기리에 판매되고 있다. 그런데, 甲은 과수원 인근에서 토석채취가\n\n     이루어지면 비산먼지 등으로 인하여 과수원에 악영향을 미친다고 판단\n\n       하여, 이 사건 처분의 취소를 구하는 소를 제기하였다. 다음 물음에 답\n\n      하시오. (50점)\n\n 물음 1) 위 취소소송에서 甲의 원고적격은 인정될 수 있는가? (20","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2022/2022_admin.pdf","body":[]},{"id":"2025-labor1-1","examYear":2025,"subject":"노동법1","topic":"경영상해고·우선재고용","points":50,"sourceExcerpt":"【문제 1】A호텔은 상시 근로자 100명을 사용하여 호텔업을 운영하는 회사이고, 甲\n      과 乙은 A호텔의 일식당에서 조리사로 근무하던 근로자이다(甲의 입사일:\n      2018. 3. 1., 乙의 입사일: 2013. 3. 1.). A호텔은 2020년부터 코로나 사태로\n      심각한 경영난을 겪게 되자 경영상 이유에 의한 해고를 실시하기로 결정\n      하고, 근로기준법 소정의 요건을 갖추어 2020. 8. 31. 甲과 乙을 포함한 20\n      명의 근로자를 경영상 이유로 해고하였다. 이렇게 해고된 근로자 중에 甲\n      과 乙을 포함하여 3명이 A호텔 일식당에서 조리사로 근무하던 사람이었\n      다. 위 해고 당시 甲은 A호텔로부터 월 500만원의 임금을 받고 있었다.\n      甲은 위 해고 이후 연락처를 변경한 사실이 없다. 甲은 위 해고 이후 실\n      직 상태에서 구직을 위해 ","lawResearchState":"PRELIMINARY_SUBSTANTIVE_DRAFT_HOLD","legalDraftAvailable":true,"legalSourceUrls":["https://www.law.go.kr/LSW/lsInfoP.do?efYd=20211014&lsiSeq=231471","https://www.law.go.kr/LSW/lsInfoP.do?efYd=20251023&lsiSeq=265959"],"pdf":"source_pdf/2025/2025_labor1.pdf","body":[{"heading":"Ⅰ. 경영상 해고의 적법성과 우선재고용은 별개 쟁점","text":"문제는 호텔의 해고가 근로기준법상 요건을 갖추었다고 전제하고 있다. 따라서 이미 전제된 긴박한 경영상 필요·해고회피 노력 등을 새롭게 부정하려는 대신, 제25조의 우선재고용 의무를 중심으로 정리한다. 우선재고용은 제24조에 따른 해고 후 3년 이내에 해고 전 담당업무와 같은 업무의 인력을 채용하려는 경우, 해고근로자의 의사를 어떻게 확인하고 처리할지를 묻는 구조이다. 대상 업무의 실질적 동일성과 채용 시점의 객관적 자료가 필요하다."},{"heading":"Ⅱ. 원문 사실관계에 대한 적용 순서","text":"甲과 乙은 A호텔 일식당 조리사였고 2020년 8월 31일을 기준으로 해고되었다. 채용하려는 일자리의 업무와 시점이 3년의 법정 기간에 속하는지 확인한다. 해고자 연락처와 취업 의사 표시, 채용정보의 접근 가능성, 호텔이 실제로 어떠한 절차로 복직 의사를 확인하였는지를 대조한다. 제25조의 문언상 우선고용은 같은 업무를 다시 채용하려는 때 문제되므로, 전혀 다른 직무 또는 기간 경과 이후의 채용에 이를 당연히 적용하지 않는다."},{"heading":"Ⅲ. 결론과 산정 항목","text":"우선재고용 의무 위반이 인정되는지와 그 위반에 따른 구제수단·금전범위는 나누어 검토한다. 실업기간, 다른 직장 취업여부, 새 근로계약을 맺을 가능성, 지급받았을 임금이 계산에 어떤 영향을 미치는지 논증이 필요하다. 2025년 시험일에 적용되는 근로기준법 및 직접 관련 대법원 판례의 원문대조 전에는 확정적인 손해배상액이나 결론을 제시하지 않는다."}]},{"id":"2023-labor1-1","examYear":2023,"subject":"노동법1","topic":"경영상해고 선정기준·징계절차","points":50,"sourceExcerpt":"【문제1】A회사는상시근로자500명을사용하여전기관련제품을제조․판매하는\n      회사이다. A회사는2018년부터계속적으로매출, 영업이익, 당기순이익이\n     전체적으로감소하여A회사에근로자과반수이상을조직하여설립․운영\n     하고있던노동조합에게사택매각, 명예퇴직등의경영위기를타개하기\n     위한비상경영안을수용할것을제안하였다. 그러나노동조합은조합원의\n     의사를무시한일방적구조조정에반대한다는의사를표명하며비상경영안\n     수용을거부하였다. 그러자A회사는소속근로자의일부를정리해고하기로\n      결정하고, 취업규칙이나단체협약등에별도의정함이없었던정리해고\n     대상자선정기준을마련하였다. A회사는근로자들을대상으로정리해고를\n     실시함에앞서노동조합과의협의과정에서업무적합도, 근무태도, 연령\n     등을기준으로정리해고대상자를선정할것임을밝혔고, 이에노동조합이\n    연령을정리해고대상자선정기준으로삼는것은부당하다는등의의견을\n","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2023/2023_labor1.pdf","body":[]},{"id":"2022-labor2-1","examYear":2022,"subject":"노동법2","topic":"쟁의행위·원청시설 점거·대체근로","points":50,"sourceExcerpt":"【문제 1】A공사는 국가의 도로를 관리하는 업무를 수행하는 공기업이다. B회사와\n\n      C회사는 시설관리용역업체이고, A공사와 청소용역계약을 체결하여, A공사의\n\n     본사에서 청소용역업무를 수행하고 있다. 甲과 乙은 B회사의 근로자로\n\n     각각 B회사 노동조합의 위원장과 사무국장이다. B회사 노동조합은 B회사\n\n     와의 임금 등에 관한 단체교섭이 결렬되자 2022. 5. 관할 지방노동위원회에\n\n     조정을 신청하였고, 조정이 성립하지 않자 쟁의행위 찬반투표를 거쳐\n\n           2022.  6.  25. 파업에 돌입하였다. B회사 노동조합은 2022.  6. 25. A공사\n\n     본사 정문 앞을 집회장소로 신고 하였으나, 신고된 장소에서 집회를 하지\n\n     않고 B회사의 근로자들에게도 평소 통행이 자유로운 A공사 본사의\n\n     본관과 옆 건물 사이의 인도에 모여서 함께 ","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2022/2022_labor2.pdf","body":[]},{"id":"2022-labor1-1","examYear":2022,"subject":"노동법1","topic":"저성과자 해고·서면통지","points":50,"sourceExcerpt":"【문제 1】A회사는 가전제품을 제조ㆍ판매하는 주식회사이다. A회사의 취업규칙은\n\n      제23조(징계사유)와는 별개로 제22조(해고사유) 제5호에서 “근무성적 또는\n\n     능력이 현저하게 불량하여 직무를 수행할 수 없다고 인정되었을 때”를\n\n     해고사유로 정하고 있다. A회사는 2016년부터 매년 하반기에 사무직\n\n     직원들을 대상으로 5개 등급(S등급 100점, A등급 80점, B등급 60점, C등급\n\n         40점, D등급 20점)의 인사평가 제도를 시행하고 인사평가의 기준과\n\n     항목을 공개하고 있으며 인사평가 결과에 대한 이의제기 절차도 체계적\n\n     으로 마련하여 사무직 직원들에게 안내하고 있다. A회사는 1차 평가자\n\n       (팀장)의 평가내용을 토대로 2차 평가(부서장)와 최종평가(담당 임원)를\n\n     하여 평가등급을 산정하고, 특히 상대평가 방식의 불합리","lawResearchState":"PRELIMINARY_SUBSTANTIVE_DRAFT_HOLD","legalDraftAvailable":true,"legalSourceUrls":["https://www.law.go.kr/LSW/lsInfoP.do?efYd=20211014&lsiSeq=231471"],"pdf":"source_pdf/2022/2022_labor1.pdf","body":[{"heading":"Ⅰ. 저성과 해고의 판단체계","text":"취업규칙이 근무성적·능력의 현저한 불량을 해고사유로 규정하였다는 사실만으로 개별 해고가 정당해지는 것은 아니다. 근로기준법 제23조의 정당한 이유 여부는 업무의 내용과 난이도, 평가절차의 객관성과 공정성, 실적의 상대적 비교, 개선 기회와 배치전환·교육 가능성, 낮은 실적의 기간과 원인을 종합하여 심사해야 한다. 인사평가가 다단계이고 이의절차가 존재한다는 점은 적법성에 도움이 되는 사실이지만, 평가결과의 정확성 및 개선 불가능성까지 자동 입증하지는 않는다."},{"heading":"Ⅱ. 통지의 내용과 시기의 별도 심사","text":"근로기준법 제27조는 해고사유 및 해고시기의 서면통지를 요구한다. 따라서 취업규칙의 추상적 조항을 기재하는 것과 근로자가 자신의 구체적 해고사유를 알 수 있도록 설명하는 것은 구분된다. 해고예고와 서면통지 역시 별개의 문제로, 일정 기간 미리 통지하였다는 사정만으로 제27조 요건이 충족되는 것은 아니다. 실제 통지서 원문과 발송·도달 시기를 보아야 하며, 평가자료의 사후 제출만으로 서면통지 자체의 흠결을 치유한다고 추정하지 않는다."},{"heading":"Ⅲ. 사례 분석 구조","text":"첫째 근무태만·저성과의 사실을 객관자료에 대응시키고, 둘째 대상자 선정·절차 및 개선기회 보장 여부를 검토하며, 셋째 취업규칙이 규정하는 징계해고와 통상해고의 성질을 분리한다. 넷째 서면통지 내용을 독립적으로 심사한다. 종합결론은 해고의 실체적 정당성과 절차적 효력을 각각 설명해야 하므로, 자료가 불충분하면 어느 점에서 결론이 달라질 수 있는지를 명시한다."}]},{"id":"2022-civil-3","examYear":2022,"subject":"민사소송법","topic":"판결 편취와 구제","points":25,"sourceExcerpt":"【문제 3】판결의 편취와 그 구제수단에 관하여 설명하시오. (25점)","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2022/2022_civil.pdf","body":[]},{"id":"2023-civil-3","examYear":2023,"subject":"민사소송법","topic":"부대항소","points":25,"sourceExcerpt":"【문제3】부대항소에관하여설명하시오. (25점)","lawResearchState":"PRELIMINARY_SUBSTANTIVE_DRAFT_HOLD","legalDraftAvailable":true,"legalSourceUrls":["https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=180709"],"pdf":"source_pdf/2023/2023_civil.pdf","body":[{"heading":"Ⅰ. 의미와 제도 취지","text":"부대항소는 한쪽 당사자의 항소로 열린 항소심에서 피항소인이 자신에게 불리한 원판결의 변경을 구할 수 있게 하는 수단이다. 민사소송법 제403조는 피항소인의 항소권이 소멸한 뒤에도 항소심 변론이 종결될 때까지 부대항소를 허용한다. 이는 항소 여부를 결정할 때 상대방의 항소 제기와 불복범위를 고려할 수 있도록 절차적 균형을 보완하는 기능이 있다."},{"heading":"Ⅱ. 종속성과 독립 항소의 예외","text":"제404조에 따르면 부대항소는 주된 항소가 취하되거나 부적법 각하되면 원칙적으로 효력을 잃는다. 다만 항소기간 안에 이루어진 부대항소는 독립한 항소로 본다. 따라서 문항에서 항소기간 경과 여부와 주된 항소의 적법성·취하 시점이 주어진다면 각각 구분하여 적용해야 한다. 이 예외를 빼고 단순히 모든 부대항소가 소멸한다고 서술하면 정답의 핵심을 놓친다."},{"heading":"Ⅲ. 방식 및 실전 답안 구성","text":"제405조는 부대항소에 항소 관련 규정이 적용된다고 한다. 대상 사건과 불복 내용, 항소심 변론종결 전 제기 여부, 항소장 또는 부대항소장의 방식, 상대방에게 미치는 불이익변경 가능성 등을 순서대로 적는다. 25점 답안에서는 제403~405조의 핵심 문언을 제시한 뒤 구체적 사례 한 가지로 종속성을 설명하고, 일반 항소와 구별하는 결론을 붙이는 구성이 적절하다."}]},{"id":"2023-admin-2","examYear":2023,"subject":"행정쟁송법","topic":"여객운송 인가·경쟁자 소송","points":25,"sourceExcerpt":"【문제2】A시에서여객자동차운송사업을하고있는甲은운송사업중일부노선을\n     같은지역여객자동차운송사업자인乙에게양도하였고, A시의시장X는\n     위양도ㆍ양수를인가하였다. 이노선에는甲이외에도여객자동차운송사\n    업자丙이일부중복된구간을운영하고있으며, 위인가처분으로해당\n     구간의사업자는甲, 乙, 丙으로증가한다. 이에丙은기존의경쟁사업자\n    외에乙이동일한운행경로를포함한운행계통을가지게되어그중복운행\n     구간의연고있는사업자수가증가하고, 그결과향후운행횟수증회, 운행\n    계통신설및변경등에있어장래기대이익이줄어들것을우려한다.\n    그런데위인가처분으로인해甲이운행하던일부노선에관한운행계통,\n     차량및부대시설등이일체로乙에게양도된것이어서, 이로인하여종전\n    노선및운행계통이나그에따른차량수및운행횟수등에변동이있는\n     것은아니다. 丙이위인가처분의취소를구하는소송을제기할경우, 원고\n     적격이인정되는가? (25점)","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2023/2023_admin.pdf","body":[]},{"id":"2022-admin-3","examYear":2022,"subject":"행정쟁송법","topic":"산업단지 계획변경 거부","points":25,"sourceExcerpt":"【문제 3】甲은 산업입지 및 개발에 관한 법령 등에 따라 관할 행정청 도지사 乙에\n\n     의해 지정된 산업단지 내에서 산업단지개발계획상 녹지용지로 되어있던\n\n     토지의 소유자이다. 甲은 해당 토지에서 폐기물처리사업을 하기 위하여\n\n     乙에게 사업부지에 관한 개발계획을 당초 녹지용지에서 폐기물처리시설\n\n     용지로 변경해 달라는 내용의 신청을 하였다. 당시 위 법령에 따르면 폐\n\n     기물처리시설용지로의 변경이 불가능하게 되어 있었다. 이에 따라 乙은\n\n     위 변경신청을 거부하는 처분을 하였고, 甲은 이에 대하여 취소소송을\n\n      제기하였다. 그런데 거부처분 이후 폐기물처리시설용지로의 변경이 가능\n\n     하도록 법령의 개정이 있었다고 할 때, 법원이 어느 시점을 기준으로\n\n     위법성을 판단하여야 하는지에 관하여 설명하시오. (25점)","lawResearchState":"PRELIMINARY_SUBSTANTIVE_DRAFT_HOLD","legalDraftAvailable":true,"legalSourceUrls":["https://law.go.kr/lsInfoP.do?docType=JO&joNo=000100&lsiSeq=195052"],"pdf":"source_pdf/2022/2022_admin.pdf","body":[{"heading":"Ⅰ. 쟁점","text":"甲은 산업단지개발계획상 녹지용지인 자신의 토지를 폐기물처리시설용지로 변경해 달라고 신청했으나 당시에는 법령상 변경이 불가능하여 거부되었다. 이후 법령이 개정되어 변경이 가능해진 경우 거부처분 취소소송에서 어느 시점의 법령·사실을 기준으로 위법성을 판단하는지가 문제다. 신청권의 존재, 거부의 처분성, 위법성의 판단시점을 구별한다."},{"heading":"Ⅱ. 원칙과 구별점","text":"행정소송의 처분 위법성은 원칙적으로 해당 처분 시의 사실상·법률상 상태를 기준으로 판단한다는 판례 법리를 우선 검토한다. 처분 이후의 법령변경을 원칙적으로 과거 거부처분에 곧바로 소급 적용하여 위법하다고 평가하지 않는다. 다만 새로운 신청에 대한 재처분, 법령에서 명문으로 소급적용을 정한 경우 등은 별도의 문제다."},{"heading":"Ⅲ. 사안의 포섭","text":"거부결정 당시 폐기물처리시설 용지로 변경이 불가능했다는 명시적 전제와 법령 개정 이후에는 가능해졌다는 사후사정을 순서대로 대조한다. 개정된 규정의 시행일과 부칙의 적용례를 확인하고, 거부처분이 내려질 당시 판단을 기준으로 판결할지 설명한다. 판결 이후 새로운 신청이나 재처분 가능성은 결론에서 간략히 분리해 기재한다."}]},{"id":"2022-civil-2","examYear":2022,"subject":"민사소송법","topic":"소송상 항변","points":25,"sourceExcerpt":"【문제 2】소송상 항변에 관하여 설명하시오. (25점)","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2022/2022_civil.pdf","body":[]},{"id":"2023-civil-2","examYear":2023,"subject":"민사소송법","topic":"장래이행의 소","points":25,"sourceExcerpt":"【문제2】장래의이행을청구하는소에관하여설명하시오. (25점)","lawResearchState":"PRELIMINARY_SUBSTANTIVE_DRAFT_HOLD","legalDraftAvailable":true,"legalSourceUrls":["https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=180709"],"pdf":"source_pdf/2023/2023_civil.pdf","body":[{"heading":"Ⅰ. 현재이행과 장래이행의 차이","text":"미래 시점에 이행기가 도래하는 채권이라도 장래에 이행청구를 미리 할 필요가 있는 경우에는 민사소송법의 장래이행 소 제도를 검토한다. 단순히 장래에 채권이 발생하거나 변제기가 아직 오지 않았다는 사정만으로 소의 이익이 인정되는 것은 아니다. 채무자의 현재 태도, 이행 거절, 반복적 불이행 위험, 청구권의 구체성 등을 살펴 미리 판결을 받아야 할 필요성을 논증한다."},{"heading":"Ⅱ. 소송요건과 본안의 구별","text":"소의 이익과 청구권의 존부는 서로 다르다. 이행기와 조건을 충분히 특정하지 못한 상태에서 승소판결을 내려도 강제집행을 할 수 없는 경우라면 청구의 특정성과 권리보호이익을 별도로 검토해야 한다. 반대로 의무의 발생 또는 기한이 명확하고 채무자가 이행의무를 다투어 장래 집행권원을 미리 확보해야 할 사정이 있다면 허용 가능성이 있다. 계속적 급부는 각 급부시기·채무관계의 확정성을 함께 설명한다."},{"heading":"Ⅲ. 답안에 남길 검증","text":"민사소송법 제251조의 원문 및 관련 대법원 선례를 기준으로 미리 청구할 필요의 구체적 심사요소를 확인한다. 원문 제시의 일반 논술형에서는 정의, 이행기 도래 전 청구 예외, 소의 이익 판단, 판결 및 집행상 주의의 네 항목으로 구성하고 과도한 단정이나 사안 없는 예시를 피한다."}]},{"id":"2023-labor2-2","examYear":2023,"subject":"노동법2","topic":"단체협약 상여금 지급","points":25,"sourceExcerpt":"【문제2】D회사에는D회사노동조합이설립되어있으며, D회사근로자가운데D회사\n    노동조합외다른노동조합에가입한자는없다. D회사와D회사노동조합\n       사이에2022. 1. 1.부터2023. 12. 31.까지유효기간을정한단체협약제20조는\n      “회사는조합원에게3월, 6월, 9월, 12월에각각300 %의상여금을지급하되,\n     그지급일은해당월의말일로한다.”고규정하고있었다. 그런데D회사는\n     경영사정의악화등을이유로2023년3월, 6월상여금을지급하지못하고\n      있는상황에서2023. 7. 1. D회사노동조합에게2023년도상여금전부를포기\n    하여줄것과향후위상여금지급규정을폐지할것을내용으로하는특별\n     노사합의를위한단체교섭요구안을제출하였다. D회사노동조합은D회사와\n     수차례에걸쳐단체교섭을하면서, D회사의경영사정의악화가객관적으로\n    매우심각한수준에이른것에공감하면서단체교섭에있어서조합원들의\n    ","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2023/2023_labor2.pdf","body":[]},{"id":"2025-civil-2","examYear":2025,"subject":"민사소송법","topic":"확인의 이익","points":25,"sourceExcerpt":"【문제 2】확인의 이익에 관하여 설명하시오. (25점)","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2025/2025_civil.pdf","body":[]},{"id":"2025-civil-3","examYear":2025,"subject":"민사소송법","topic":"재소금지","points":25,"sourceExcerpt":"【문제 3】재소의 금지에 관하여 논하시오. (25점)","lawResearchState":"PRELIMINARY_SUBSTANTIVE_DRAFT_HOLD","legalDraftAvailable":true,"legalSourceUrls":["https://www.law.go.kr/LSW/lsInfoP.do?chrClsCd=010202&lsId=001700&lsiSeq=258669&urlMode=lsInfoP"],"pdf":"source_pdf/2025/2025_civil.pdf","body":[{"heading":"Ⅰ. 제도의 핵심","text":"민사소송법상 재소금지는 소를 취하한 경우에도 일정 요건에서 같은 소송을 다시 제기할 수 없도록 제한하는 원칙이다. 모든 소 취하가 재소금지를 낳는 것은 아니므로, 본안에 관한 종국판결이 있었는지, 누가 어떤 소를 취하했는지, 후소의 소송물·당사자 동일성이 어떠한지를 분리하여 심사한다."},{"heading":"Ⅱ. 제도 취지와 적용 순서","text":"이미 본안 판단이 있었는데 원고가 결과를 피하려고 소를 취하하고 동일 사건을 재소하는 식의 소송경제 및 상대방 지위 침해를 방지하려는 취지이다. 시간의 순서대로 소제기, 본안종국판결, 취하의 효력, 후소제기를 배열하고, 취하의 효력과 기판력·소송계속의 종료를 혼용하지 않는다. 후소의 청구취지 표현만 달라졌더라도 실질적인 동일성을 검토해야 한다."},{"heading":"Ⅲ. 답안 구조와 미결","text":"2025년 시행 민사소송법 제267조와 사건 관련 판례를 직접 대조한 뒤, 원칙·예외·동일소 여부를 논증한다. 반소·독립당사자참가·일부취하 등의 경우에는 단순한 최초의 소와 동일하다고 기계적으로 판단하지 않는다. 본문은 출제 당시 조문과 판시법리 확인 전의 학습용 초안이다."}]},{"id":"2023-admin-3","examYear":2023,"subject":"행정쟁송법","topic":"산재보험료 체납독촉","points":25,"sourceExcerpt":"【문제3】甲은자기소유토지에전원주택을신축하고자건축업자인乙과전원주택\n     신축공사에관하여도급계약을체결하였고, 乙은근로복지공단에고용보험\n     ㆍ산재보험관계성립신고를하면서신고서에위신축공사사업장의사업주를\n     甲으로기재하여제출하였다. 甲은위사업장에관한고용보험료와산재\n     보험료중일부만납부하였고, 국민건강보험공단은甲에게체납된고용보\n     험료및산재보험료를납부할것을독촉하였다. 관련법령상보험료의신고\n    또는납부등산재보험및고용보험에관한사업의주요업무는고용노동부\n     장관으로부터위탁받은근로복지공단이수행하고, 다만보험료체납관리\n     등징수업무는국민건강보험공단이위탁받아수행하고있다. 甲은건축주가\n     직접공사를하지않고공사전부를수급인에게도급을준경우에는근로자를\n     사용하여공사를수행하는수급인이원칙적으로그공사에관한사업주로서\n    고용보험및산재보험의가입자가되어고용보험료및산재보험료를납부\n    할의무를부담한다는","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2023/2023_admin.pdf","body":[]},{"id":"2023-labor1-2","examYear":2023,"subject":"노동법1","topic":"계열기업·근로관계","points":25,"sourceExcerpt":"【문제2】A회사는정보통신사업등을영위하는회사인데, 2011. 10. A회사의플랫폼\n     사업부문이분할되어B회사가설립되었다. A회사는B회사의주식98.1 %를\n     보유하고있다. B회사는2016. 12. 31. 기준1조원이넘는자산과독립적인\n     운영조직을갖춘회사이다. A회사는B회사의플랫폼관련전문성과A회사의\n     마케팅경쟁력을결합한신규사업인‘플랫폼을기반으로한쇼핑, 미디어,\n      요식사업’을진행하였는데, 그과정에서B회사로부터다수근로자를전출\n      받았다. 한편근로자丙은2015. 3. B회사에입사한직후A회사의‘플랫폼을\n     기반으로한쇼핑, 미디어, 요식사업’으로전출되어관련업무를수행하였다.\n     위전출과관련해A회사는B회사와“B회사는전출근로자를고용한사업\n    주로서전출근로자와근로관계가있음을보증하고임금지급등근로관계\n     법령상의사용자책임을부담하며, A회사는B회사가전출근로자와의근로\n    관계를","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2023/2023_labor1.pdf","body":[]},{"id":"2022-admin-2","examYear":2022,"subject":"행정쟁송법","topic":"부당해고 금전보상명령","points":25,"sourceExcerpt":"【문제 2】甲은 교육사업을 영위하는 회사 乙과 기간의 정함이 없는 근로계약을\n\n     체결하고 근무하던 중 乙로부터 해고를 통보받았다. 이에 대해 甲은\n\n     서울지방노동위원회에 부당해고 구제를 신청하였고, 이후 원직에 복직하는\n\n     대신 금전보상명령을 구하는 것으로 신청취지를 변경하였다. 그러나\n\n     서울지방노동위원회에의 구제신청과 이어진 중앙노동위원회에의 재심\n\n     신청이 각각 기각됨에 따라, 甲은 2022. 7. 22. 서울행정법원에 재심판정의\n\n     취소를 구하는 소를 제기하였다. 한편, 乙은 2022.  7. 19. 정당한 절차에\n\n     의해 취업규칙을 개정하였고, 이 규칙은 이 사건 소가 계속 중이던\n\n           2022.  8. 1.부터 시행되었다. 종전 취업규칙에는 정년에 관한 규정이\n\n     없었으나 ‘개정 취업규칙’에는 근로자가 만 60세에 도달하는 날을 ","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2022/2022_admin.pdf","body":[]},{"id":"2025-admin-3","examYear":2025,"subject":"행정쟁송법","topic":"국유재산 사용·위탁계약 해지","points":25,"sourceExcerpt":"【문제 3】A지방고용노동청장(이하 ‘A청장’)은 민원인의 이용 편의를 위하여 청사\n        지하 1층에 편의점을 위탁운        영하기로 결정하고, ‘청사 내 편의시설(편의\n        점) 운영자 선정 입찰 공고’를 하였다. 입찰 결과 甲이 낙찰자로 결정되었\n        고, A청장은 2022. 12. 20. 甲과 계약기간은 2023. 1. 1.부터 2024. 12. 31.\n        까지(2년간), 연 사용료 1억 원 등을 내용으로 하는 ‘청사 편의점 운영권\n        위탁계약(이하 ‘위탁운영계약’)’을 체결하여 편의점 운영자 선정 절차가 완\n        료되었다. 그 후 甲은 편의점을 1년 이상 운영하면서 납부기한까지 사용\n        료를 납부하지 않았고, 이에 A청장은 2024. 2. 29.「국유재산법」의 규정\n        을 근거로 위탁운영계약을 해지하였다. 甲은 위탁운영계약 ","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2025/2025_admin.pdf","body":[]},{"id":"2022-labor2-2","examYear":2022,"subject":"노동법2","topic":"노조간부 사업장 순회","points":25,"sourceExcerpt":"【문제 2】丙 등은 산업별 노동조합인 E산업노동조합 소속 간부들로서 D회사의 산업\n\n     안전보건법 위반 사실의 증거수집 등을 할 목적으로 E산업노동조합 소속\n\n     지회 사업장인 D회사의 평택공장 내 생산1공장에 들어가 이 공장의 시설\n\n     이나 설비를 작동시키지 않은 채 그 상태를 눈으로 살펴보았고 그 시간은\n\n        30분 정도에 그쳤다. 그리고 丙 등이 이러한 현장순회 과정에서 D회사\n\n     측을 폭행ㆍ협박하거나 강제적인 물리력을 행사한 바 없고, 근무 중인\n\n     근로자들의 업무를 방해하거나 소란을 피운 사실도 없다. 또한 그 이전\n\n     에도 E산업노동조합 하부조직인 평택지부 소속 간부들이 같은 목적으로\n\n     이 공장을 방문하여 관리자 측의 별다른 제지 없이 현장순회를 해온\n\n     사실이 있다. 이러한 丙 등의 행위가 정당한 조합활동에 해당하는지에\n\n     관하","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2022/2022_labor2.pdf","body":[]},{"id":"2025-labor2-2","examYear":2025,"subject":"노동법2","topic":"교원노조 중재재정·교섭대상","points":25,"sourceExcerpt":"【문제 2】「교원의 노동조합 설립 및 운영 등에 관한 법률」(이하 ‘교원노조법’이라\n     한다)에 의하여 설립신고를 마친 A교원노동조합은 2013. 7. 31.부터 2021.\n     4. 28.까지 B광역시교육감과 단체교섭을 진행하였으나 합의에 이르지 못\n     하자 2021. 4. 30. 중앙노동위원회에 교원노조법에 따른 노동쟁의 조정신\n     청을 하였다.\n     중앙노동위원회는 2021. 5. 13.부터 2021. 5. 31.까지 조정절차를 진행하였\n     으나 A교원노동조합과 B광역시교육감 모두 중앙노동위원회가 제시한 조\n     정안을 거부함으로 조정을 종료하고 2021. 6. 1. 교원노조법에 따른 중재\n     를 개시하였고, 2021. 6. 15. 중재재정을 하였다.\n     중앙노동위원회는 다음과 같은 내용의 중재재정을 하였다. 중재재정 제8\n     조는 교육청이 유치원에 유치원운영","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2025/2025_labor2.pdf","body":[]},{"id":"2022-labor1-2","examYear":2022,"subject":"노동법1","topic":"정기상여금·통상임금","points":25,"sourceExcerpt":"【문제 2】상시 근로자 100명을 사용하여 금속 가공업을 하는 A회사와 노동조합이\n\n     체결한 단체협약 제20조는 “정기상여금은 기본급의  600 % 지급률에\n\n     따라 지급하되, 지급일 이전에 입사, 복직, 휴직하는 사람의 정기상여금은\n\n     일할 계산한다.”라고 규정하고 있다. 한편, A회사의 취업규칙 제30조는\n\n      “입사 또는 퇴직한 날이 속하는 월의 임금(기본급 및 제수당)은 일할\n\n     계산하여 지급한다.”라고 규정하고 있고, 취업규칙 제35조는 “정기상여금은\n\n     지급일 현재 재직 중인 자에 한하여 지급한다.”라고 규정하고 있다. A회사는\n\n     위와 같은 단체협약과 취업규칙에 따라 정기상여금을 2개월마다 기본급의\n\n          100 %씩 정기적, 계속적으로 지급하였는데, A회사가 실제로 지급일 이전에\n\n     퇴직한 근로자에게 정기상여금을 일할 지급하지 않","lawResearchState":"PRELIMINARY_SUBSTANTIVE_DRAFT_HOLD","legalDraftAvailable":true,"legalSourceUrls":["https://www.law.go.kr/LSW/lsInfoP.do?efYd=20211014&lsiSeq=231471","https://scourt.go.kr/portal/news/NewsViewAction.work?gubun=4&searchOption=&searchWord=&seqnum=10200"],"pdf":"source_pdf/2022/2022_labor1.pdf","body":[{"heading":"Ⅰ. 쟁점의 특정","text":"단체협약은 정기상여금을 연 600% 지급하도록 정하고 있으며 입사·복직·휴직자의 금액을 일할 계산한다. 취업규칙에는 지급일 재직자에게만 지급한다는 문구가 있다. 시험답안은 상여금이 소정근로의 대가인지, 정기·일률성 및 2022년 당시 판례상 고정성을 갖는지, 단체협약과 취업규칙의 해석이 충돌하는지를 분리한다. 실제 지급관행, 퇴직자에게 일할 정산을 하지 않은 점, 단체협약의 우선성과 최저기준의 문제를 섞지 말고 순서대로 검토해야 한다."},{"heading":"Ⅱ. 시험 당시 적용할 판례 시점","text":"2022년 시험 당시에는 2013년 전원합의체의 정기성·일률성·고정성 판단체계가 중요한 검토 대상이었다. 그보다 나중인 2024년 12월 19일 대법원 전원합의체는 통상임금의 개념적 징표에서 고정성을 제외하고 변경 법리의 적용범위도 별도로 정하였다. 그러므로 2022년 출제의 채점 취지와 2024년 이후 현행법리를 같은 문장으로 설명하면 연혁 오류가 생긴다. 두 법리의 적용 기준을 구분한 다음, 이 문제의 상여금 지급조건이 구 법리에서 어떤 의미를 가지는지를 논증해야 한다."},{"heading":"Ⅲ. 사안포섭과 결론 유보","text":"연 600% 상여금이 2개월마다 계속 지급되었다는 사실은 정기성 판단자료이다. 단체협약의 일할 지급 문구와 취업규칙의 재직조건은 그 효과가 곧바로 동일하지 않다. 약정의 대상, 각 규범의 효력, 실제 퇴직자 처리, 근로기준법상 강행규정과 판례의 해석순서를 검토한다. 재직조건만으로 무조건 해당·불해당을 단정하거나 2024년 신법리를 소급하여 2022년 답안의 결론으로 대체해서는 안 된다. 해당 전원합의체 사건의 사안·시점 및 원출제 해설과의 직접 대조가 남아 있다."}]},{"id":"2025-admin-2","examYear":2025,"subject":"행정쟁송법","topic":"직무정지 변경재결·취소소송","points":25,"sourceExcerpt":"【문제 2】개업노무사로 업무를 수행하고 있는 甲은 2024. 3. 한 달 동안 3차례에 걸쳐\n      노동 관계 법령에 위반되는 행위에 관한 지도ㆍ상담을 하다가 관할 지방\n      고용노동청에 적발되었다. 이에 고용노동부장관 A는 공인노무사자격심의ㆍ\n      징계위원회의 징계의결에 따라 2024. 8. 26. 甲에게 6월의 직무정지처분을\n      하였고, 甲은 다음 날 그 처분서를 수령하였다. 甲은 2024. 9. 30. 6월의\n      직무정지처분이 재량권을 일탈․남용하였다며 관할 행정심판위원회에 6월의\n      직무정지처분의 취소심판을 청구하였다. 행정심판위원회는 2024. 11. 4.\n      “A가 甲에 대하여 한 6월의 직무정지처분을 3월의 직무정지처분으로 변경\n      하라”는 일부인용의 이행재결을 하였으며, 2024. 11. 18. 그 재결서 정본이\n      甲에게 도달하였다. A는 ","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2025/2025_admin.pdf","body":[]},{"id":"2025-labor1-2","examYear":2025,"subject":"노동법1","topic":"화학물질 누출·작업중지권","points":25,"sourceExcerpt":"【문제 2】2023. 7. 26. 오전 8시경 S시 산업단지내 A회사에서 상온에 노출되는 경우\n      사람에게 호흡곤란, 피부질환 등을 발생시키는 화학물질이 누출되는 사고\n      가 발생하였다. S시 소방본부는 반경 150m 까지 통제선을 설치하고, 통제\n      선 내에 있는 해당 근로자들에 대해 대피를 유도하였고, 반경 1km 내 주\n      민들에게도 창문을 폐쇄하고 외출을 자제할 것을 당부하는 대피방송을 하\n      였다. 이와 함께 소방본부는 전문기관에 누출사고 발생지점으로부터 반경\n      200m 거리까지 화학물질 검출을 의뢰하였고, 오전 9시경 ‘반경 5           ∼10m\n      지점에 5 ∼8ppm이 검출되나, 반경 10m 이상의 거리에서는 검출이 되지\n      않는다’는 취지의 회신을 받았다. 위 사고로 A회사의 2명의 근로자가 어\n      지럼증으로 병원에 이송되","lawResearchState":"PRELIMINARY_SUBSTANTIVE_DRAFT_HOLD","legalDraftAvailable":true,"legalSourceUrls":["https://www.law.go.kr/lsInfoP.do?lsiSeq=291447"],"pdf":"source_pdf/2025/2025_labor1.pdf","body":[{"heading":"Ⅰ. 판단기준의 구분","text":"산업안전보건법 제51조의 사업주 작업중지 의무와 제52조의 근로자 작업중지·대피권은 규율 주체와 효과가 다르다. 근로자가 작업중지 당시 급박한 산업재해 위험이 있다고 볼 합리적 이유가 있는지, 위험을 인지한 시점과 장소를 기준으로 판단해야 한다. 사후에 검사된 농도가 낮다는 사실만으로 초기 대피판단이 위법해지는 것은 아니며, 반대로 사고 발생이라는 이유만으로 영구적인 작업중지가 자동 정당화되는 것도 아니다."},{"heading":"Ⅱ. 사실포섭","text":"문제에서는 오전 8시 화학물질 누출, 반경 150m 통제·대피, 반경 1km 주의방송, 오전 9시 검출결과, 근로자 2명의 이상증세가 제시된다. 이 자료를 시간대별로 분해한다. 작업중지 시각에 근로자가 알았던 정보, 현장 위험물질의 성질, 독성 영향범위, 현장조치 및 보고 여부를 확인한다. 실제 작업장과 검출 지점 사이의 거리, 위험해소 뒤 사업주 안내와 복귀 명령의 합리성도 별도로 검토한다."},{"heading":"Ⅲ. 부당처우 금지와 결론","text":"제52조의 작업중지와 보고, 급박한 위험을 믿을 합리적 이유가 있던 근로자에 대한 불리한 처우 금지의 요건을 분리한다. 2025년 시험 당시에 효력이 있던 산업안전보건법 원문을 기준으로 판시법리와 적용례를 확인해야 한다. 법문이 2026년에 개정되었을 가능성을 검토하여 2026년 표현을 2025년 시험법으로 소급 적용하지 않는다."}]},{"id":"2024-노동법2|1|2","examYear":2024,"subject":"노동법","topic":"제1문 (2)","points":25,"sourceExcerpt":"甲은 A자동차 주식회사(이하 ‘A회사’라 한다) B대리점을 설립하여 자동차 판매업을 영위하고 있다. B대리점에서 카마스터(car master)로 근무하는 10명 중 乙, 丙, 丁, 戊(이하 이들 4명을 ‘이 사건 카마스터들’이라 한다)는 甲이 미리 마련한 정형화된 형식의 계약서를 통해 여러 해에 걸쳐서 매년 자동차 판매용역계약을 체결하고 A회사 자동차 판매, 수금, 채권관리 등의 업무를 수행하는 자동차 판매원이다. 甲과 이 사건 카마스터들 사이의 판매용역계약서에는 계약 해지사유로 ① 카마스터의 영업실적이 극히 부진하여 계약을 존속시킴이 부적합한 경우, ② 카마스터의 고의 또는 중대한 과실로 甲의 명예를 훼손하거나 영업상 손실을 가져온 경우, ③ 甲이 정한 판매조건 및 판매지침을 위반하는 경우, ④ 카마스터에 대한 파산선고, 압류, 가압류, 가처분 등이 있는 경우 4가지를 규정하고 있다. 이 사건 카마스터들은 A회","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2024/2024_labor2.pdf","body":[]},{"id":"2024-노동법1|2|0","examYear":2024,"subject":"노동법","topic":"제2문","points":25,"sourceExcerpt":"상시 100명의 근로자를 사용하여 반도체 웨이퍼를 제조하는 A회사에는 A노동조합이 설립되어 있다. 甲은 A회사 생산직 근로자인데 A노동조합 조직부장으로 활동하던 중 업무지시 위반을 이유로 해고되었다. 이에 甲은 관할 지방노동위원회에 부당해고구제신청을 하였다. 지방노동위원회는 부당해고를 인정하면서 원직복직 및 해고기간 동안 발생한 임금상당액의 지급을 내용으로 하는 구제명령을 하였고, 구제명령은 그대로 확정되었다. 甲은 해고기간 동안 A회사와 같은 업종을 경영하는 B회사에 생산직으로 취업하여 600만 원의 임금을 지급받았고, 아울러 A노동조합으로부터 구제기금 명목으로 100만 원을 지급받았다. 甲이 해고기간 동안 정상적으로 근로를 제공했더라면 받을 수 있었던 임금상당액이자 평균임금의 총액은 1,800만 원인데, A회사는 위 1,800만 원에서 해고기간 동안 발생한 수입 700만 원 전액의 공제를 주장한다. A회사가 ","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2024/2024_labor1.pdf","body":[]},{"id":"2026-민사소송법|3|0","examYear":2026,"subject":"민사소송법","topic":"제3문","points":25,"sourceExcerpt":"소송행위의 추후보완에 관하여 설명하시오. (25점)","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2026/2026_civil.pdf","body":[]},{"id":"2026-민사소송법|2|0","examYear":2026,"subject":"민사소송법","topic":"제2문","points":25,"sourceExcerpt":"정기금판결에 대한 변경의 소에 관하여 설명하시오. (25점)","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2026/2026_civil.pdf","body":[]},{"id":"2024-행정쟁송법|2|0","examYear":2024,"subject":"행정쟁송법","topic":"제2문","points":25,"sourceExcerpt":"甲은 인터넷설치서비스업을 행하는 법인이다. 甲이 2024. 1. 22. 고객민원 및 직원 간의 불협화음 등을 이유로 甲 소속 근로자 A에게 정직 7개월의 징계처분을 하자, A는 2024. 1. 26. 관할 지방노동위원회에 구제신청을 하였다. 관할 지방노동위원회는 2024. 2. 27. 징계사유가 인정되고 징계양정이 과하다고 볼 수 없다는 이유로 A의 구제신청을 기각하였다. A는 2024. 3. 4. 관할 지방노동위원회의 판정에 불복하여 중앙노동위원회에게 재심을 신청하였다. 중앙노동위원회는 2024. 4. 30. 관할 지방노동위원회의 판정을 취소하고 A에게 행한 정직은 부당정직임을 인정하면서 甲에게 판정서를 송달받은 날부터 30일 이내에 A에 대한 정직을 취소하고 정직기간 중 받을 수 있었던 임금상당액을 지급하라고 구제명령(이하 ‘이 사건 구제명령’이라 한다)을 하였다. 한편, 중앙노동위원회는 2024. 6. 26","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2024/2024_admin.pdf","body":[]},{"id":"2026-노동법2|1|1","examYear":2026,"subject":"노동법","topic":"제1문 (1)","points":25,"sourceExcerpt":"A회사는 시내버스 운수업을 영위하는 법인이다. A회사의 사업장에는 B노동조합과 C노동조합이 있는데, B노동조합 조합원 수는 100명, C노동조합 조합원 수는 7명이다. 교섭창구단일화 절차를 통하여 B노동조합이 교섭대표노동조합이 되었다. A회사와 교섭대표노동조합인 B노동조합이 체결한 단체협약에 따르면, ‘조합원이 회사의 지시에 위반하였을 때’, ‘조합원이 직무상 의무를 위반하거나 직무를 태만히 하였을 때’ 등의 사유에 해당하면 징계할 수 있고(제28조 제1항, 제2항), 징계의 종류로는 ‘견책, 승무정지, 징계해고’가 있다(제29조). 또한 징계는 상벌위원회를 통하여 하고(제35조), 상벌위원회 위원은 노사 각 3인으로 구성한다(제38조). A회사와 B노동조합은 위 단체협약 체결 당시 상벌위원회규정도 함께 체결하였다. 상벌위원회규정 제4조에 따르면, “위원회는 사용자 측 위원 3인과 근로자 측 위원 3인으로 구성하","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2026/2026_labor2.pdf","body":[]},{"id":"2026-노동법2|1|2","examYear":2026,"subject":"노동법","topic":"제1문 (2)","points":25,"sourceExcerpt":"A회사는 시내버스 운수업을 영위하는 법인이다. A회사의 사업장에는 B노동조합과 C노동조합이 있는데, B노동조합 조합원 수는 100명, C노동조합 조합원 수는 7명이다. 교섭창구단일화 절차를 통하여 B노동조합이 교섭대표노동조합이 되었다. A회사와 교섭대표노동조합인 B노동조합이 체결한 단체협약에 따르면, ‘조합원이 회사의 지시에 위반하였을 때’, ‘조합원이 직무상 의무를 위반하거나 직무를 태만히 하였을 때’ 등의 사유에 해당하면 징계할 수 있고(제28조 제1항, 제2항), 징계의 종류로는 ‘견책, 승무정지, 징계해고’가 있다(제29조). 또한 징계는 상벌위원회를 통하여 하고(제35조), 상벌위원회 위원은 노사 각 3인으로 구성한다(제38조). A회사와 B노동조합은 위 단체협약 체결 당시 상벌위원회규정도 함께 체결하였다. 상벌위원회규정 제4조에 따르면, “위원회는 사용자 측 위원 3인과 근로자 측 위원 3인으로 구성하","l :25,"sourceExcerpt":"甲은 乙 소유의 X토지를 乙로부터 매수하는 계약을 체결하고 매매대금을 모두 지급하였으나 소유권이전등기를 경료받지 못하였다. 이에 甲은 乙을 상대로 X토지에 관한 소유권이전등기청구의 소를 제기하였다. (아래의 각 물음은 독립적이다.) (50점)\n甲과 乙의 제1심 소송계속 중, 丁은 乙로부터 X토지를 甲보다 먼저 매수했다고 주장하며 甲을 상대로는 소유권이전등기청구권존재확인을 청구하고 乙을 상대로는 소유권이전등기를 청구하는 권리주장참가 형태의 독립당사자참가신청을 하였다. 제1심법원은 甲의 청구를 인용하고, 甲의 청구와 丁의 청구가 양립 가능하다고 보아 丁의 참가신청을 부적법 각하하는 판결을 선고하였다. 이 판결에 대해 丁만 항소하고 乙은 항소 및 부대항소를 하지 않았다. 항소심법원은 丁의 참가신청에 대해서는 제1심법원의 판단과 마찬가지로 부적법하다는 이유로 丁의 항소를 기각하고, 甲의 청구에 대해서는 제1심법원의 판단","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2026/2026_civil.pdf","body":[]},{"id":"2026-민사소송법|1|1","examYear":2026,"subject":"민사소송법","topic":"제1문 (1)","points":25,"sourceExcerpt":"甲은 乙 소유의 X토지를 乙로부터 매수하는 계약을 체결하고 매매대금을 모두 지급하였으나 소유권이전등기를 경료받지 못하였다. 이에 甲은 乙을 상대로 X토지에 관한 소유권이전등기청구의 소를 제기하였다. (아래의 각 물음은 독립적이다.) (50점)\n甲은 변호사 丙에게 소송을 위임하고 상소의 제기에 관한 특별한 권한을 수여하였다. 丙이 甲의 소송대리인으로 제1심 소송을 진행하던 중 甲이 사망하였다. 甲의 상속인으로는 A와 B가 있는데 그중 A만 소송절차를 수계하였고, 제1심법원은 ‘망 甲의 소송수계인 A’를 원고로 표시하여 청구기각 판결을 선고하였다. 이 판결정본을 丙이 송달받았고, 丙은 ‘망 甲의 소송수계인 A’를 항소인으로 기재한 항소장을 제출하여 현재 항소심법원에 소송계속 중에 있다. 뒤늦게 이를 안 B가 위 항소심법원에 소송수계신청을 한 경우, 그 신청은 적법한가?","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2026/2026_civil.pdf","body":[]},{"id":"2026-노동법2|2|0","examYear":2026,"subject":"노동법","topic":"제2문","points":25,"sourceExcerpt":"상시 5천 명의 근로자를 사용하여 선박을 수리ㆍ제조하는 A회사는 2026. 1.경 경영상의 이유로 500명의 희망퇴직 등 구조조정을 진행하였다. 이에 대응하기 위해 A회사의 노동조합은 2026. 2. 25. 甲을 비롯한 노동조합 대의원들의 행동지침으로 ‘수시로 집회를 갖고 조합원과 함께 투쟁결의를 다지고, 구조조정 반대와 회사규탄, A회사 대표이사 퇴진 내용 등을 담은 대자보나 선전방송 등을 만들어 활용할 것’ 등을 결정하였다. 甲은 2026. 3. 5.부터 2026. 4. 30.까지 약 2개월 동안 근무가 시작되기 이전 출근시간 무렵에 도크 게이트나 문화관, 생산기술관 앞 등 길가에서 노동조합 방송차량을 이용하여 12회에 걸쳐 선전방송을 하였고, 2026. 4. 7. 생산기술관 현관 출입문 등에 유인물을 1회 게시하였다. 그 주된 내용은 A회사가 희망퇴직을 빙자하여 일방적으로 정리해고를 강행하고 있고, 단체협약","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2026/2026_labor2.pdf","body":[]},{"id":"2024-민사소송법|3|0","examYear":2024,"subject":"민사소송법","topic":"제3문","points":25,"sourceExcerpt":"보충송달에 관하여 설명하시오. (25점)","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2024/2024_civil.pdf","body":[]},{"id":"2026-노동법1|2|0","examYear":2026,"subject":"노동법","topic":"제2문","points":25,"sourceExcerpt":"A회사는 상시 근로자 100명을 고용하여 전력선 등을 생산ㆍ판매하는 회사로서 그 산하에 전선사업본부, 중전기사업본부, 경영지원실 등을 두고 있다. 전선사업본부 산하에는 전력선사업부(초고압케이블 생산), 재료사업부(기초 소재 생산), 통신사업부(광케이블과 F/S케이블 생산) 등을, 중전기사업본부 산하에는 변압기사업부(변압기 생산), 차단기사업부(차단기 생산) 등을 두고 있다. 전력선사업부는 수원의 전선공장에, 재료사업부와 통신사업부는 안산(반월)공장에 있다. A회사의 ERP(Enterprise Resource Planning, 기업자원관리 시스템)상으로는 사업부별 영업이익과 매출액이 구별되나, 이는 회계의 편의를 위하여 회사 내부적으로 작성한 자료에 불과하다. 재무제표는 A회사를 기준으로 단일하게 작성ㆍ공시되었고, 재무를 담당하는 조직을 위 각 사업부 단위로 별도로 두고 있지는 않다. A회사는 전선사업본부장 등의 ","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2026/2026_labor1.pdf","body":[]},{"id":"2026-행정쟁송법|2|0","examYear":2026,"subject":"행정쟁송법","topic":"제2문","points":25,"sourceExcerpt":"甲 건설회사(이하 ‘甲’이라 함)에 고용된 작업자가 건설현장에서 추락하여 사망하는 일이 발생하였다. 이에 대하여 ｢산업안전보건법｣에 따라 고용노동부장관의 산업재해발생률 산정 및 통보권한의 위탁을 받은 한국산업안전보건공단(이하 ‘공단’이라 함)은 위 사망사고를 산입하여 ｢산업안전보건법 시행규칙｣ 제4조 및 [별표 1]에 따라 매년 통보하여야 하는 건설업체별 사고사망만인율(이하 ‘만인율’이라 함)을 甲에게 통보하였다.\n※ 사고사망만인율(%) = 사고사망자 수 × 10,000 / 상시근로자 수\n만인율 수치는 ｢건설산업기본법｣ 제23조에 따른 시공능력평가에서 매년 3년간 공사실적 가중평균액을 감액하는 사유가 되고, 입찰참가자격 사전심사(PQ)와 적격심사, 종합심사낙찰제 심사에 따라 각각 감점으로 반영되게 된다. 이것의 직접 적용기간은 매년 7. 1.부터 1년간이지만, 최근 3년간 수치의 가중평균 구조를 통하여 그 불이익","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2026/2026_admin.pdf","body":[]},{"id":"2024-행정쟁송법|3|0","examYear":2024,"subject":"행정쟁송법","topic":"제3문","points":25,"sourceExcerpt":"A시장은 「감염병의 예방 및 관리에 관한 법률」에 근거한 집합금지명령을 2024. 5. 1. 공고하면서 관내 다중이용시설을 대상으로 2024. 5. 6.부터 매일 22시에서 다음날 06시 사이의 영업을 제한하였는바, 그에 대하여 유흥주점 업주 甲은 2024. 5. 27. 취소소송을 제기하였고, 2024. 9. 5. 현재 소송 계속 중이다. 한편, 예방조치에도 불구하고 감염병 확산세가 급등하자 A시장은 2024. 5. 31.부터 관내 다중이용시설의 영업제한 시간을 매일 20시에서 다음날 07시까지로 늘리는 내용의 집합금지명령을 2024. 5. 29. 공고하였다. 음식점 업주 乙은 해외에 체류하다가 귀국하여 2024. 6. 8. 자신의 업소에 부착된 공고문 및 안내문을 보고 비로소 그 명령을 알게 되었고, 2024. 8. 30. 그에 대하여 취소소송을 제기하였다. 甲의 소송이 대상적격을 갖춘 것인지와 乙의 소송이 적","lawResearchState":"ORIGINAL_DOCUMENT_AND_LAW_CANDIDATES_HOLD","legalDraftAvailable":false,"legalSourceUrls":[],"pdf":"source_pdf/2024/2024_admin.pdf","body":[]}];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const q=document.querySelector('#q').value.trim().toLowerCase(),f=document.querySelector('#filter').value;const view=data.filter(x=>(f==='all'||(x.legalDraftAvailable?f==='draft':f==='hold'))&&[x.id,x.examYear,x.subject,x.topic,x.sourceExcerpt].join(' ').toLowerCase().includes(q));document.querySelector('#counts').textContent=`${view.length}/47개 표시 · 예비초안 13개 · 내용 최종승인 0개`;document.querySelector('#entries').innerHTML=view.map(x=>`<article><details><summary>${esc(x.examYear)} ${esc(x.subject)} · ${esc(x.topic)} <small>(${esc(x.points)}점 · ${x.legalDraftAvailable?'예비 본문 있음':'원본/근거 대조 대기'})</small></summary><p class="status">HOLD — 시험 당시 법령·직접 판례·학술 전문가 검수 미완료</p><p class="mini">문항 ID: <code>${esc(x.id)}</code> · 원본: <code>${esc(x.pdf)}</code></p><section><h3>원본 문제 발췌</h3><p>${esc(x.sourceExcerpt.slice(0,1800))}</p></section>${x.body.length?x.body.map(p=>`<section><h3>${esc(p.heading)}</h3><p>${esc(p.text)}</p></section>`).join(''):'<p>확인 전인 법률 문장이나 특정 판례를 임의로 만들어 넣지 않았습니다.</p>'}${x.legalSourceUrls.length?'<h3>공식 원문 근거 후보</h3>'+x.legalSourceUrls.map(u=>`<p><a target="_blank" rel="noopener noreferrer" href="${esc(u)}">법제처/대법원 원문 열기</a></p>`).join(''):''}</details></article>`).join('')||'<p>검색 결과가 없습니다.</p>';}q.addEventListener('input',draw);filter.addEventListener('change',draw);draw();</script></body></html>
