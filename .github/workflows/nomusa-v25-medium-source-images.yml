name: NOMUSA V25 MEDIUM source visual proofread pages

on:
  push:
    branches: [review/nomusa-auto-v1-20year-gate-20261115]
    paths:
      - '.github/workflows/nomusa-v25-medium-source-images.yml'
      - 'scripts/nomusa-v25-medium-source-images.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nomusa-v25-medium-images
  cancel-in-progress: true

jobs:
  render:
    if: github.ref == 'refs/heads/review/nomusa-auto-v1-20year-gate-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Review branch checkout without token retention
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF image engine
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7
      - name: Render three original MEDIUM question papers
        run: python scripts/nomusa-v25-medium-source-images.py .
      - name: Upload official image snapshots for human checking
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nomusa-v25-three-medium-source-pdf-pages
          path: |
            review-artifacts/NOMUSA_V25_MEDIUM_SOURCE_PAGES/*.png
            review-artifacts/NOMUSA_V25_MEDIUM_SOURCE_PAGES.json
          retention-days: 14
          if-no-files-found: error
