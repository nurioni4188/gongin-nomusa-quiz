name: RC29 Offline Official Exam Validation (NO VERCEL)
on:
  push:
    branches: [rc29/question-bank-validation]
    paths:
      - 'index.html'
      - 'data/rc29-exam-scope.json'
      - 'data/rc29-2022-A-reference.json'
      - 'data/rc29-2-source-manifest.json'
      - 'data/rc29-3-2023-scan-manifest.json'
      - 'data/rc29-3-2023-ocr-review.json'
      - 'data/rc29-4-2023-answer-table-reference.json'
      - 'data/rc29-5-visual-draft-progress.json'
      - 'data/rc29-6-progress.json'
      - 'data/rc29-7-firstpass-manifest.json'
      - 'data/rc29-8-ocr-review-progress.json'
      - 'data/rc29-8a-batch-triage.json'
      - 'data/rc29-8b-2023-highrisk.json'
      - 'data/rc29-8c-2023-firstpass.json'
      - 'data/rc29-8d-source-page-queue.json'
      - 'data/rc29-integrated-1020.json'
      - 'data/rc29-one-shot-full-report.json'
      - 'scripts/rc29-*'
      - '.github/workflows/rc29-offline-validation.yml'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc29-offline-validation
  cancel-in-progress: true
jobs:
  validate-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: RC29 ONE-SHOT 1020-source audit results and explicit HOLD
        run: node scripts/rc29-one-shot-report-check.mjs
      - name: RC29 unified 1020 structural and privacy technical audit
        run: node scripts/rc29-integrated-1020-check.mjs
      - name: RC29.8D validate 31 high-risk page-hint queue without certifying originals
        run: node scripts/rc29-8d-page-queue-check.mjs
      - name: RC29.8C validate six civil-law first-pass drafts and HOLD metadata
        run: node scripts/rc29-8c-check.mjs
      - name: RC29.8B check six new source correction metadata records (HOLD)
        run: node scripts/rc29-8b-check.mjs
      - name: RC29.8A validate 103 text-only OCR triage and four first-pass corrections (HOLD)
        run: node scripts/rc29-8a-batch-check.mjs
      - name: RC29.8 check four corrected OCR drafts and remaining unverified queue
        run: node scripts/rc29-8-review-check.mjs
      - name: RC29.7 verify completed first-pass draft metadata (not official)
        run: node scripts/rc29-7-draft-coverage.mjs
      - name: RC29.6 verify first-pass source progress without certifying original paper
        run: node scripts/rc29-6-progress-check.mjs
      - name: RC29.5 validate staged 2023 visual draft metadata (no source text in repo)
        run: node scripts/rc29-5-draft-metadata-check.mjs
      - name: RC29.4 validate 150 HWP image-reference labels without scoring approval
        run: node scripts/rc29-4-answer-table-check.mjs
      - name: RC29.3 validate unverified legacy OCR and mobile review manifest only
        run: node scripts/rc29-3-ocr-review-check.mjs
      - name: RC29.3 check 2023 scanned source inventory (no OCR, no scoring)
        run: node scripts/rc29-3-scan-manifest.mjs
      - name: RC29.2 check offline evidence manifest integrity without PDF claims
        run: node scripts/rc29-2-ci-manifest.mjs
      - name: Inspect 2022 official A answer reference without scoring approval
        run: node scripts/rc29-2022-reference.mjs
      - name: Audit official examination coverage and produce all 1020 slots
        run: node scripts/rc29-audit.mjs
      - name: Install offline Chromium testing dependency
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Offline PC tablet Android viewport and synthetic scoring tests
        run: python scripts/rc29-browser.py
        continue-on-error: true
      - name: Separate technical CI PASS from official source RELEASE HOLD
        if: always()
        run: node scripts/rc29-integrated-release-decision.mjs
      - name: Explain technical PASS and explicit RELEASE HOLD
        if: always()
        run: |
          echo '## Technical CI only: official source RELEASE HOLD' >> "$GITHUB_STEP_SUMMARY"
          echo 'Scoring and Vercel deployment are prohibited until separately approved.' >> "$GITHUB_STEP_SUMMARY"
      - name: Always archive source review and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc29-offline-evidence
          path: rc29-evidence/
          if-no-files-found: warn
          retention-days: 7
