name: RC29 Offline Official Exam Validation (NO VERCEL)
on:
  push:
    branches: [rc29/question-bank-validation]
    paths:
      - 'index.html'
      - 'data/rc29-exam-scope.json'
      - 'scripts/rc29-*'
      - '.github/workflows/rc29-offline-validation.yml'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc29-offline-validation
  cancel-in-progress: true
jobs:
  validate-no-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Audit official examination coverage and produce all 1020 slots
        run: node scripts/rc29-audit.mjs
      - name: Install offline Chromium testing dependency
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Offline PC tablet Android viewport and synthetic scoring tests
        run: python scripts/rc29-browser.py
        continue-on-error: true
      - name: Final official source PASS or HOLD (never deploy)
        if: always()
        run: node scripts/rc29-gate.mjs
      - name: Always archive source review and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc29-offline-evidence
          path: rc29-evidence/
          if-no-files-found: warn
          retention-days: 7
