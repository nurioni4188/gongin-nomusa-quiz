name: RC28 Offline Validation (NO Vercel deploy)
on:
  push:
    branches: [rc28/offline-ci-hold]
    paths:
      - index.html
      - scripts/rc28-*
      - docs/rc28-baseline.json
      - vercel.json
      - .github/workflows/rc28-offline-validation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc28-offline-validation
  cancel-in-progress: true
jobs:
  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Static question-bank audit (HOLD until official data complete)
        run: node scripts/rc28-audit.mjs --strict
        continue-on-error: true
      - name: Offline browser dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Desktop / tablet / Android viewport smoke tests
        run: python scripts/rc28-browser.py
        continue-on-error: true
      - name: Release gate (read-only, never deploy)
        if: always()
        run: node scripts/rc28-gate.mjs
      - name: Preserve evidence on HOLD
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc28-offline-evidence
          path: rc28-evidence/
          if-no-files-found: warn
          retention-days: 7
