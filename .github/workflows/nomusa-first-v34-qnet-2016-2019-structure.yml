name: NOMUSA First V34 2016-2019 official QNet PDF/ZIP structure
on:
  push:
    branches:
      - review/nomusa-auto-v1-20year-gate-20261115
    paths:
      - '.github/workflows/nomusa-first-v34-qnet-2016-2019-structure.yml'
      - 'scripts/nomusa-first-v34-qnet-2016-2019-source-structure.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nomusa-first-v34-qnet-2016-2019
  cancel-in-progress: true
jobs:
  source-structure:
    if: github.ref == 'refs/heads/review/nomusa-auto-v1-20year-gate-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Review source only checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependencies
        run: python -m pip install pymupdf==1.26.7 requests==2.32.5
      - name: Read actual Q-Net 2016 2017 2018 2019 original PDF/ZIP and page structure
        run: python scripts/nomusa-first-v34-qnet-2016-2019-source-structure.py
      - name: Save source proof, but never upload original copyrighted exam archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomusa-first-v34-2016-2019-original-structure
          path: review-artifacts/NOMUSA_FIRST_V34/NOMUSA_FIRST_V34_2016_2019_QNET_FILES.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve main and Production
        run: git diff --exit-code
