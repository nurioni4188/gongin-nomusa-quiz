let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

function startQuiz() {
  const year = document.getElementById("yearFilter").value;
  const subject = document.getElementById("subjectFilter").value;
  currentQuestions = questions.filter(q => 
    (year === "all" || q.year === year) && 
    (subject === "all" || q.subject === subject)
  );
  if (currentQuestions.length === 0) {
    alert("해당 조건의 문제가 없습니다.");
    return;
  }
  currentIndex = 0;
  score = 0;
  answered = false;
  document.getElementById("score").innerText = "";
  showQuestion();
}

function showQuestion() {
  if (currentIndex >= currentQuestions.length) {
    document.getElementById("quiz").innerHTML = `<div class="question-box"><h2>완료!</h2><p>점수: ${score} / ${currentQuestions.length}</p></div>`;
    document.getElementById("nextBtn").classList.add("hidden");
    document.getElementById("showAnswerBtn").classList.add("hidden");
    return;
  }
  const q = currentQuestions[currentIndex];
  answered = false;
  let html = `<div class="question-box">
    <div class="meta">${q.year}년 | ${q.subject} | 문제 ${q.num}</div>
    <div class="q-text">${q.question}</div>`;
  q.options.forEach((opt, i) => {
    html += `<div class="option" onclick="selectOption(${i})" data-idx="${i}">${i+1}. ${opt}</div>`;
  });
  html += `</div>`;
  document.getElementById("quiz").innerHTML = html;
  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("showAnswerBtn").classList.remove("hidden");
  document.getElementById("score").innerText = `진행: ${currentIndex + 1} / ${currentQuestions.length} | 현재 점수: ${score}`;
}

function selectOption(idx) {
  if (answered) return;
  document.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
  document.querySelector(`.option[data-idx="${idx}"]`).classList.add("selected");
}

function showAnswer() {
  if (answered) return;
  const q = currentQuestions[currentIndex];
  const selected = document.querySelector(".option.selected");
  answered = true;
  document.querySelectorAll(".option").forEach((el, i) => {
    if (q.answer !== null && i === q.answer) el.classList.add("correct");
    else if (el.classList.contains("selected")) el.classList.add("wrong");
  });
  if (selected && q.answer !== null && parseInt(selected.dataset.idx) === q.answer) score++;
  document.getElementById("showAnswerBtn").classList.add("hidden");
  document.getElementById("nextBtn").classList.remove("hidden");
  document.getElementById("score").innerText = `진행: ${currentIndex + 1} / ${currentQuestions.length} | 현재 점수: ${score}`;
}

function nextQuestion() {
  currentIndex++;
  showQuestion();
}

startQuiz();
</script>
