<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공인노무사 1차 기출 암기</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
  h1 { color: #1a73e8; text-align: center; }
  .filters { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  select, button { padding: 8px 12px; font-size: 16px; border-radius: 6px; border: 1px solid #ddd; }
  button { background: #1a73e8; color: white; border: none; cursor: pointer; }
  button:hover { background: #1557b0; }
  .question-box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
  .q-text { font-weight: bold; margin-bottom: 15px; line-height: 1.5; }
  .option { padding: 12px; margin: 8px 0; background: #f8f9fa; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .option:hover { background: #e8f0fe; }
  .option.selected { border-color: #1a73e8; background: #e8f0fe; }
  .option.correct { background: #d4edda; border-color: #28a745; }
  .option.wrong { background: #f8d7da; border-color: #dc3545; }
  .meta { color: #666; font-size: 14px; margin-bottom: 10px; }
  .controls { text-align: center; margin-top: 15px; }
  #score { text-align: center; font-size: 18px; margin: 10px 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>공인노무사 1차 기출 문제 웹</h1>
<p style="text-align:center; color:#666;">업로드된 PDF 기반 간단한 암기용 퀴즈 (일부 문제 예시 포함)<br>전체 문제 추가 시 확장 가능</p>

<div class="filters">
  <select id="yearFilter">
    <option value="all">전체 연도</option>
    <option value="2026">2026</option>
    <option value="2025">2025</option>
  </select>
  <select id="subjectFilter">
    <option value="all">전체 과목</option>
    <option value="노동법(1)">노동법(1)</option>
    <option value="민법">민법</option>
  </select>
  <button onclick="startQuiz()">시작 / 다시풀기</button>
</div>

<div id="score"></div>
<div id="quiz"></div>
<div class="controls">
  <button id="nextBtn" class="hidden" onclick="nextQuestion()">다음 문제</button>
  <button id="showAnswerBtn" class="hidden" onclick="showAnswer()">정답 확인</button>
</div>

<script>
const questions = [
  {
    year: "2026", subject: "노동법(1)", num: 1,
    question: "근로기준법령에 관한 설명으로 옮지 않은 것은?",
    options: [
      "누구든지 근로자의 취업을 방해할 목적으로 비밀 기호 또는 명부를 작성ㆍ사용하거나 통신을 하여서는 아니 된다.",
      "사용기간이 3개월 미만인 일용근로자에 대하여는 근로자 명부를 작성하지 아니할 수 있다.",
      "사용자는 근로자 명부에 적을 사항이 변경된 경우에는 지체 없이 정정하여야 한다.",
      "사용자는 임금대장의 경우 마지막으로 써 넣은 날부터 기산하여 3년간 보존하여야 한다.",
      "사용자는 근로자가 퇴직한 후라도 사용 기간, 업무 종류, 지위와 임금, 그 밖에 필요한 사항에 관한 증명서를 청구하면 사실대로 적은 증명서를 즉시 내주어야 한다."
    ],
    answer: 1
  },
  {
    year: "2026", subject: "노동법(1)", num: 2,
    question: "근로기준법령상 선택적 근로시간제에 관한 설명으로 옮지 않은 것은?",
    options: [
      "사용자는 취업규칙에 따라 업무의 시작 및 종료 시각을 근로자의 결정에 맡기기로 한 근로자에 대하여 근로자대표와의 서면 합의에 따라 선택적 근로시간제를 도입할 수 있다.",
      "선택적 근로시간제의 정산기간은 신상품 또는 신기술의 연구개발 업무의 경우 3개월 이내로 정할 수 있다.",
      "선택적 근로시간제는 18세 이상의 임신 중의 여성 근로자에게 적용할 수 있다.",
      "사용자는 선택적 근로시간제에 따라 근로자를 근로시킬 경우에는 임금 수준이 낮아지지 아니하도록 임금보전방안을 강구하여야 한다.",
      "사용자는 선택적 근로시간제를 도입하기 위해서는 근로자대표와의 서면합의로 표준 근로시간을 정하여야 한다."
    ],
    answer: 2
  },
  {
    year: "2026", subject: "민법", num: 1,
    question: "관습법과 사실인 관습에 관한 설명으로 옮지 않은 것은? (다툼이 있으면 판례에 따름)",
    options: [
      "관습법은 사회의 거듭된 관행이 법적 확신을 얻어 규범으로 승인ㆍ강행되기에 이른 것이다.",
      "사실인 관습은 법률행위에 적용될 수 있는 제정법이 임의규정인 경우에는 법률행위의 해석기준이 될 수 있다.",
      "공동선조와 성과 본을 같이 하는 미성년인 후손은 고유한 의미의 종중의 구성원이 될 수 없다.",
      "사실인 관습은 당사자의 주장ㆍ증명이 없더라도 법원이 직권으로 확정해야 한다.",
      "사실인 관습은 민법의 법원이 아니다."
    ],
    answer: 3
  },
  {
    year: "2025", subject: "노동법(1)", num: 1,
    question: "근로기준법령상 단시간근로자의 근로조건에 관한 설명으로 옮지 않은 것은?",
    options: [
      "단시간근로자의 1일 소정근로시간 수는 4주 동안의 소정근로시간을 그 기간의 단시간 근로자의 총 소정근로일 수로 나눈 시간 수로 한다.",
      "단시간근로자에게만 적용되는 취업규칙을 불이익하게 변경하는 경우에는 적용대상이 되는 단시간근로자 과반수의 동의를 받아야 한다.",
      "단시간근로자의 연차 유급휴가에 대하여 지급해야 하는 임금은 시간급을 기준으로 한다.",
      "사용자는 단시간근로자와 합의한 경우에만 초과근로를 시킬 수 있다.",
      "여성인 단시간근로자의 출산전후휴가에 대하여 지급해야 하는 임금은 일급 통상임금을 기준으로 한다."
    ],
    answer: 4
  }
];

let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;

function startQuiz() {
  const year = document.getElementById("yearFilter").value;
  const subject = document.getElementById("subjectFilter").value;
  currentQuestions = questions.filter(q => 
    (year === "all" || q.year === year) && 
    (subject === "all" || q.subject === subject)
  );
  if (currentQuestions.length === 0) {
    alert("해당 조건의 문제가 없습니다.");
    return;
  }
  currentIndex = 0;
  score = 0;
  answered = false;
  document.getElementById("score").innerText = "";
  showQuestion();
}

function showQuestion() {
  if (currentIndex >= currentQuestions.length) {
    document.getElementById("quiz").innerHTML = `<div class="question-box"><h2>완료!</h2><p>점수: ${score} / ${currentQuestions.length}</p></div>`;
    document.getElementById("nextBtn").classList.add("hidden");
    document.getElementById("showAnswerBtn").classList.add("hidden");
    return;
  }
  const q = currentQuestions[currentIndex];
  answered = false;
  let html = `<div class="question-box">
    <div class="meta">${q.year}년 | ${q.subject} | 문제 ${q.num}</div>
    <div class="q-text">${q.question}</div>`;
  q.options.forEach((opt, i) => {
    html += `<div class="option" onclick="selectOption(${i})" data-idx="${i}">${i+1}. ${opt}</div>`;
  });
  html += `</div>`;
  document.getElementById("quiz").innerHTML = html;
  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("showAnswerBtn").classList.remove("hidden");
  document.getElementById("score").innerText = `진행: ${currentIndex + 1} / ${currentQuestions.length} | 현재 점수: ${score}`;
}

function selectOption(idx) {
  if (answered) return;
  document.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
  document.querySelector(`.option[data-idx="${idx}"]`).classList.add("selected");
}

function showAnswer() {
  if (answered) return;
  const q = currentQuestions[currentIndex];
  const selected = document.querySelector(".option.selected");
  answered = true;
  document.querySelectorAll(".option").forEach((el, i) => {
    if (i === q.answer) el.classList.add("correct");
    else if (el.classList.contains("selected")) el.classList.add("wrong");
  });
  if (selected && parseInt(selected.dataset.idx) === q.answer) score++;
  document.getElementById("showAnswerBtn").classList.add("hidden");
  document.getElementById("nextBtn").classList.remove("hidden");
  document.getElementById("score").innerText = `진행: ${currentIndex + 1} / ${currentQuestions.length} | 현재 점수: ${score}`;
}

function nextQuestion() {
  currentIndex++;
  showQuestion();
}

// 초기 로드
startQuiz();
</script>
</body>
</html>
