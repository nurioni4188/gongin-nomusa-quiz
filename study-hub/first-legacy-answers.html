<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>공인노무사 1차 과거정답 검토</title><style>body{margin:0;background:#f5f7fb;color:#1f2d42;font:15px system-ui,'Malgun Gothic',sans-serif}.wrap{max-width:930px;margin:auto;padding:20px 14px 70px}h1{font-size:24px}.notice{padding:14px;border:1px solid #e8cd85;background:#fff7e4;border-radius:9px}.bar{display:flex;flex-wrap:wrap;gap:12px;padding:15px;background:white;border-radius:10px;margin-top:18px}label{display:grid;gap:4px;flex:1 1 145px}select,input{padding:10px;border:1px solid #ccd3dd;border-radius:6px;min-width:0}table{border-collapse:collapse;width:100%;background:white;margin-top:15px}td,th{padding:10px 8px;border-bottom:1px solid #e9edf3;text-align:left}th{background:#eaf0f9}.ans{font-weight:bold;color:#265d90}.muted{color:#687382}@media(max-width:480px){h1{font-size:20px}td,th{padding:8px 5px;font-size:12px}}</style></head><body><main class="wrap"><h1>1차 과거 기출 정답 조회 · 검토본</h1><p class="muted"><a href="index.html">학습 허브로 돌아가기</a> · 기존 2022~2026년 1,020문항 및 저장기록은 변경하지 않습니다.</p><p class="notice"><b>HOLD</b> — 2008·2009년 A형 250문항의 원본 이미지 전사 초안입니다. 독립 대조 전 자동 채점에 사용하지 마세요. 2010~2021년은 정답 원본을 접수했으나 전사 대기 상태입니다.</p><section class="bar"><label>연도<select id="year"></select></label><label>형<select id="type"><option>A</option><option>B</option></select></label><label>과목<select id="subject"></select></label><label>문항번호<input id="number" placeholder="전체" type="number" min="1" max="125"></label></section><p id="state" class="muted"></p><div style="overflow-x:auto"><table><thead><tr><th>연도</th><th>시험형</th><th>과목</th><th>번호</th><th>정답(전사)</th><th>검증</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="legacy-first-answer-review.js"></script><script>(function(){'use strict';const d=window.NOMUSA_FIRST_LEGACY_REVIEW,$=x=>document.getElementById(x);if(!d){$('state').textContent='정답 데이터가 없습니다';return;}d.sourceOnlyYears.forEach(x=>$('year').add(new Option(x.year,x.year)));$('year').value='2008';function subj(){const a=[...new Set(d.records.filter(x=>x.year==$('year').value).map(x=>x.subject))];$('subject').replaceChildren(new Option('전체',''),...a.map(x=>new Option(x,x)));}function run(){const y=+$('year').value;const a=d.records.filter(x=>x.year===y&&x.type===$('type').value&&(!$('subject').value||x.subject===$('subject').value)&&(!$('number').value||x.questionNo===+$('number').value));$('state').textContent=`${y}년 ${$('type').value}형 · ${a.length}건 · 정답 승인 HOLD`;$('rows').replaceChildren(...a.map(x=>{const tr=document.createElement('tr');[x.year,x.type,x.subject,x.questionNo,x.answers.join(','),'HOLD'].forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(i===4)td.className='ans';tr.append(td);});return tr;}));} $('year').addEventListener('change',()=>{subj();run()});['type','subject','number'].forEach(x=>$(x).addEventListener('input',run));subj();run();})();</script></body></html>
